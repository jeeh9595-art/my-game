<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>8호실 · 3D</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:#0d1015;color:#e3e9ed;overflow:hidden;
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
       -webkit-tap-highlight-color:transparent;}
  canvas#view{display:block;width:100vw;height:100vh;touch-action:none;}

  /* ---- 입장 ---- */
  .cover{position:fixed;inset:0;z-index:40;background:#0d1015;overflow-y:auto;}
  .wrap{max-width:520px;margin:0 auto;padding:34px 18px 60px;}
  h1{font-size:30px;letter-spacing:8px;margin:0 0 4px;}
  .tag{font-size:12px;color:#7d8894;margin-bottom:26px;letter-spacing:1px;}
  .card{background:#161b21;border:1px solid #232b33;border-radius:12px;padding:16px 17px;margin-bottom:12px;}
  h2{font-size:11.5px;letter-spacing:2px;color:#7d8894;text-transform:uppercase;font-weight:500;margin:0 0 11px;}
  input{font:inherit;font-size:16px;background:#11161b;color:#e3e9ed;border:1px solid #2a323b;
        border-radius:9px;padding:11px 12px;width:100%;}
  button{font:inherit;font-size:15px;border:none;border-radius:9px;padding:12px 20px;
         background:#4c7dfc;color:#fff;cursor:pointer;width:100%;}
  button.ghost{background:#2c343d;}
  button:active{transform:translateY(1px);}
  button:disabled{background:#242b33;color:#5b646d;}
  .muted{color:#7d8894;font-size:12.5px;line-height:1.75;}
  .note{background:#1b2128;border-left:3px solid #45c2b7;border-radius:0 8px 8px 0;
        padding:11px 14px;font-size:13.5px;color:#c3ccd5;margin-bottom:12px;}
  .note b{color:#45c2b7;}
  .note.r{border-left-color:#e8695e;background:#35201e;color:#f0c9c5;}
  .note.r b{color:#e8695e;}
  .code{font-size:42px;letter-spacing:12px;font-weight:700;text-align:center;color:#ffd75e;
        background:#11161b;border:1px solid #2a323b;border-radius:12px;padding:12px 6px 12px 18px;margin-bottom:10px;}
  .linkbox{font-size:11.5px;color:#8b95a0;word-break:break-all;background:#11161b;
           border:1px solid #2a323b;border-radius:9px;padding:9px 11px;margin-bottom:8px;}
  .plist{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .prow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;background:#1b2128;}
  .dot{width:13px;height:13px;border-radius:50%;flex:none;}
  .prow .nm{flex:1;font-size:14px;}
  .chip{font-size:10.5px;letter-spacing:1px;padding:2px 8px;border-radius:5px;background:#2a323b;color:#98a4b0;}

  /* ---- 게임 HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #where{position:absolute;top:14px;left:0;right:0;text-align:center;
         font-size:15px;letter-spacing:2px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9);}
  #where small{display:block;font-size:11.5px;color:#9aa5b1;letter-spacing:1px;margin-top:2px;}
  #roster{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;}
  .rchip{display:flex;align-items:center;gap:7px;background:rgba(13,16,21,.72);
         border-radius:7px;padding:4px 9px;font-size:12.5px;}
  .rchip .dot{width:10px;height:10px;}
  .rchip.off{opacity:.4;}
  #help{position:absolute;bottom:12px;left:0;right:0;text-align:center;
        font-size:12px;color:#8b95a0;text-shadow:0 1px 6px rgba(0,0,0,.9);}
  #stick{position:absolute;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;
         background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
         pointer-events:auto;display:none;}
  #stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;
           border-radius:50%;background:rgba(255,255,255,.24);}
  #net{position:absolute;top:12px;right:12px;font-size:11.5px;color:#7d8894;
       background:rgba(13,16,21,.7);border-radius:7px;padding:4px 9px;}
  #net.bad{color:#e8695e;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="where"></div>
  <div id="roster"></div>
  <div id="net">연결 중</div>
  <div id="stick"><i></i></div>
  <div id="help">WASD 이동 · 마우스 드래그로 시점 · 휠로 확대</div>
</div>

<!-- ===== 입장 ===== -->
<div class="cover" id="cover">
  <div class="wrap">
    <h1>8호실</h1>
    <div class="tag">3D 프로토타입 · 1단계 · 공간과 접속</div>

    <div id="stepName">
      <div class="card">
        <h2>이름</h2>
        <input id="inName" placeholder="게임에서 쓸 이름" maxlength="8" autocomplete="off">
      </div>
      <div class="card">
        <h2>참가하기</h2>
        <input id="inCode" placeholder="방 번호 4자리" maxlength="4" autocomplete="off"
               style="text-transform:uppercase;letter-spacing:6px;text-align:center;margin-bottom:9px;">
        <button id="btnJoin">방 들어가기</button>
      </div>
      <div class="card">
        <h2>방 만들기</h2>
        <div class="muted" style="margin-bottom:10px;">방장도 같이 플레이합니다. 방장이 나가면 방이 닫힙니다.</div>
        <button class="ghost" id="btnHost">새 방 만들기</button>
      </div>
      <div class="muted" style="text-align:center;">
        <a href="./" style="color:#7d8894;">← 규칙 보기</a>
      </div>
    </div>

    <div id="stepLobby" class="hidden">
      <div class="card" id="codeCard">
        <h2>방 번호</h2>
        <div class="code" id="codeTxt">----</div>
        <div class="linkbox" id="linkTxt"></div>
        <button class="ghost" id="btnCopy">링크 복사</button>
        <div class="muted" id="copied" style="margin-top:7px;"></div>
      </div>
      <div class="card">
        <h2>들어온 사람</h2>
        <div class="plist" id="lobbyList"></div>
      </div>
      <div class="card" id="startCard">
        <button id="btnEnter">공간으로 들어가기</button>
        <div class="muted" style="margin-top:9px;">
          지금은 1단계라 걸어다니는 것까지만 됩니다. 게임 규칙은 다음 단계에서 얹습니다.
        </div>
      </div>
    </div>

    <div id="stepErr" class="hidden">
      <div class="card"><div class="note r" id="errMsg"></div>
      <button onclick="location.reload()">처음으로</button></div>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script src="peerjs.min.js"></script>
<script>
"use strict";
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ri(n){return (Math.random()*n)|0;}
var PI=Math.PI;

var ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function mkCode(){var s="";for(var i=0;i<4;i++)s+=ALPHA[ri(ALPHA.length)];return s;}
function pid(c){return "room8-3d-"+c;}

var ROOM_COLORS=[0xe0483e,0xe8912f,0xd8c22b,0x5fa83e,0x2e9b63,0x3d9fd1,0x2f4b87,0x8b5bc4];
var MAXP=8;

/* ================= 공간 규격 ================= */
var HALL_R=9.5;        // 중앙 홀 반지름
var ROOM_D=17;         // 방 중심까지 거리
var ROOM_W=6.4;        // 방 폭
var ROOM_L=6.0;        // 방 깊이
var DOOR_W=2.4;        // 문 폭
var WALL_H=3.2, WALL_T=0.35;

var scene,camera,renderer,clock;
var colliders=[];      // {x,z,hw,hh} AABB
var avatars={};        // name -> {group,target,label}
var meMesh=null;

/* ================= 씬 ================= */
function initScene(){
  var cv=$("view");
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0d1015);
  scene.fog=new THREE.Fog(0x0d1015,26,58);

  camera=new THREE.PerspectiveCamera(52,1,0.1,140);
  clock=new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xc8d4e4,0x1a1f27,0.65));
  var sun=new THREE.DirectionalLight(0xffffff,0.75);
  sun.position.set(14,26,10); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-32; sun.shadow.camera.right=32;
  sun.shadow.camera.top=32; sun.shadow.camera.bottom=-32;
  sun.shadow.camera.far=70; sun.shadow.bias=-0.0008;
  scene.add(sun);

  buildFloor();
  buildHall();
  for(var i=0;i<MAXP;i++) buildRoom(i);

  window.addEventListener("resize",resize);
  resize();
}

function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}

function addCollider(x,z,hw,hh){ colliders.push({x:x,z:z,hw:hw,hh:hh}); }

function box(w,h,d,x,y,z,color,ry){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:color,roughness:0.85}));
  m.position.set(x,y,z);
  if(ry) m.rotation.y=ry;
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m);
  return m;
}

function buildFloor(){
  var g=new THREE.Mesh(new THREE.CircleGeometry(34,72),
    new THREE.MeshStandardMaterial({color:0x2c333c,roughness:0.95}));
  g.rotation.x=-PI/2; g.receiveShadow=true;
  scene.add(g);
  var grid=new THREE.GridHelper(68,68,0x394250,0x333b46);
  grid.position.y=0.01; scene.add(grid);
}

function buildHall(){
  var f=new THREE.Mesh(new THREE.CircleGeometry(HALL_R,64),
    new THREE.MeshStandardMaterial({color:0x3a434f,roughness:0.9}));
  f.rotation.x=-PI/2; f.position.y=0.02; f.receiveShadow=true;
  scene.add(f);

  var ring=new THREE.Mesh(new THREE.RingGeometry(HALL_R-0.18,HALL_R,80),
    new THREE.MeshBasicMaterial({color:0x5b6675,side:THREE.DoubleSide}));
  ring.rotation.x=-PI/2; ring.position.y=0.03; scene.add(ring);

  // 중앙 기둥
  var p=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.25,4.4,20),
    new THREE.MeshStandardMaterial({color:0x4a5462,roughness:0.7}));
  p.position.y=2.2; p.castShadow=true; p.receiveShadow=true; scene.add(p);
  addCollider(0,0,1.3,1.3);

  var lamp=new THREE.PointLight(0xffd9a0,0.9,26,2);
  lamp.position.set(0,5.2,0); scene.add(lamp);
  var bulb=new THREE.Mesh(new THREE.SphereGeometry(0.3,14,10),
    new THREE.MeshBasicMaterial({color:0xffe6c0}));
  bulb.position.set(0,5.2,0); scene.add(bulb);
}

/* 방 i: 홀 바깥 방사형 배치, 문은 중앙을 향한다 */
function roomAngle(i){ return -PI/2 + i*(PI*2/MAXP); }
function roomCenter(i){
  var a=roomAngle(i);
  return {x:Math.cos(a)*ROOM_D, z:Math.sin(a)*ROOM_D, a:a};
}

function buildRoom(i){
  var c=roomCenter(i), col=ROOM_COLORS[i];
  var g=new THREE.Group();
  g.position.set(c.x,0,c.z);
  g.rotation.y=-c.a;   // 로컬 -X 방향이 홀을 향하도록
  scene.add(g);

  // 바닥
  var f=new THREE.Mesh(new THREE.PlaneGeometry(ROOM_L,ROOM_W),
    new THREE.MeshStandardMaterial({color:0x39424e,roughness:0.95}));
  f.rotation.x=-PI/2; f.position.y=0.02; f.receiveShadow=true; g.add(f);

  // 색 띠 (문 앞 바닥)
  var strip=new THREE.Mesh(new THREE.PlaneGeometry(0.5,ROOM_W),
    new THREE.MeshBasicMaterial({color:col}));
  strip.rotation.x=-PI/2; strip.position.set(-ROOM_L/2+0.26,0.04,0);
  g.add(strip);

  var wallMat=new THREE.MeshStandardMaterial({color:0x525c6a,roughness:0.9});
  function wall(w,d,x,z){
    var m=new THREE.Mesh(new THREE.BoxGeometry(w,WALL_H,d),wallMat);
    m.position.set(x,WALL_H/2,z); m.castShadow=true; m.receiveShadow=true;
    g.add(m);
    // 월드 좌표 AABB (회전 고려해 보수적으로 반지름 사용)
    var wp=new THREE.Vector3(x,0,z); g.localToWorld(wp);
    var ca=Math.abs(Math.cos(c.a)), sa=Math.abs(Math.sin(c.a));
    addCollider(wp.x,wp.z,(w*ca+d*sa)/2,(w*sa+d*ca)/2);
  }
  // 뒷벽 (홀 반대쪽)
  wall(WALL_T,ROOM_W, ROOM_L/2,0);
  // 양 옆벽
  wall(ROOM_L,WALL_T, 0, ROOM_W/2);
  wall(ROOM_L,WALL_T, 0,-ROOM_W/2);
  // 앞벽 (문 양쪽)
  var side=(ROOM_W-DOOR_W)/2;
  wall(WALL_T,side, -ROOM_L/2, (ROOM_W-side)/2);
  wall(WALL_T,side, -ROOM_L/2,-(ROOM_W-side)/2);

  // 문틀 색
  [1,-1].forEach(function(s){
    var jamb=new THREE.Mesh(new THREE.BoxGeometry(0.42,WALL_H,0.42),
      new THREE.MeshStandardMaterial({color:col,roughness:0.6}));
    jamb.position.set(-ROOM_L/2,WALL_H/2,s*DOOR_W/2);
    jamb.castShadow=true; g.add(jamb);
  });

  // 뒷벽 번호판
  var num=makeLabel(String(i+1),col,132);
  num.position.set(ROOM_L/2-0.25,2.0,0);
  num.rotation.y=-PI/2;
  num.scale.set(2.0,2.0,1);
  g.add(num);

  // 방 조명
  var l=new THREE.PointLight(col,0.55,11,2);
  l.position.set(0.6,2.6,0); g.add(l);
}

/* 캔버스 텍스처 라벨 */
function makeLabel(text,color,size){
  var c=document.createElement("canvas");
  c.width=256; c.height=128;
  var x=c.getContext("2d");
  x.clearRect(0,0,256,128);
  x.font="bold "+(size||54)+"px system-ui, sans-serif";
  x.textAlign="center"; x.textBaseline="middle";
  x.fillStyle="#"+("000000"+(color||0xffffff).toString(16)).slice(-6);
  x.fillText(text,128,66);
  var t=new THREE.CanvasTexture(c);
  t.anisotropy=4;
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(2.4,1.2,1);
  return s;
}

/* ================= 아바타 ================= */
function makeAvatar(name,colorIdx){
  var col=ROOM_COLORS[colorIdx%ROOM_COLORS.length];
  var g=new THREE.Group();
  var mat=new THREE.MeshStandardMaterial({color:col,roughness:0.55});
  var body=new THREE.Mesh(new THREE.CapsuleGeometry(0.33,0.86,4,14),mat);
  body.position.y=0.94; body.castShadow=true; g.add(body);
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.27,20,14),mat);
  head.position.y=1.72; head.castShadow=true; g.add(head);
  var nose=new THREE.Mesh(new THREE.SphereGeometry(0.075,10,8),
    new THREE.MeshStandardMaterial({color:0xf2f4f7}));
  nose.position.set(0,1.72,0.25); g.add(nose);
  var legs=new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.42,3,10),mat);
  legs.position.y=0.3; legs.castShadow=true; g.add(legs);

  var lab=makeLabel(name,0xffffff,44);
  lab.position.y=2.35; lab.scale.set(2.2,1.1,1);
  g.add(lab);

  var ring=new THREE.Mesh(new THREE.RingGeometry(0.42,0.52,24),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.7,side:THREE.DoubleSide}));
  ring.rotation.x=-PI/2; ring.position.y=0.05; g.add(ring);

  scene.add(g);
  return {group:g,tx:0,tz:0,try_:0,body:body,legs:legs,phase:0};
}

/* ================= 이동 / 카메라 ================= */
var me={x:0,z:HALL_R*0.55,ry:0,speed:4.4};
var camYaw=0,camPitch=0.42,camDist=7.2;
var keys={};

window.addEventListener("keydown",function(e){
  keys[e.key.toLowerCase()]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(e.key.toLowerCase())>=0) e.preventDefault();
});
window.addEventListener("keyup",function(e){ keys[e.key.toLowerCase()]=false; });
window.addEventListener("blur",function(){ keys={}; });

var dragging=false,lastX=0,lastY=0,dragId=-1;
var cv=$("view");
cv.addEventListener("pointerdown",function(e){
  dragging=true; dragId=e.pointerId; lastX=e.clientX; lastY=e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove",function(e){
  if(!dragging||e.pointerId!==dragId) return;
  camYaw-=(e.clientX-lastX)*0.005;
  camPitch=Math.max(0.08,Math.min(1.05,camPitch+(e.clientY-lastY)*0.004));
  lastX=e.clientX; lastY=e.clientY;
});
function endDrag(e){ if(e&&e.pointerId!==dragId) return; dragging=false; dragId=-1; }
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("wheel",function(e){
  e.preventDefault();
  camDist=Math.max(3.4,Math.min(16,camDist+(e.deltaY>0?0.6:-0.6)));
},{passive:false});

/* 모바일 조이스틱 */
var stick={active:false,id:-1,dx:0,dy:0};
(function(){
  var el=$("stick"),knob=el.querySelector("i");
  if(!("ontouchstart" in window)) return;
  el.style.display="block";
  $("help").textContent="왼쪽 원으로 이동 · 화면을 끌어 시점";
  el.addEventListener("pointerdown",function(e){
    stick.active=true; stick.id=e.pointerId; el.setPointerCapture(e.pointerId); move(e);
  });
  el.addEventListener("pointermove",function(e){ if(stick.active&&e.pointerId===stick.id) move(e); });
  function up(e){ if(e.pointerId!==stick.id) return;
    stick.active=false; stick.dx=0; stick.dy=0; knob.style.transform=""; }
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  function move(e){
    var r=el.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
    var d=Math.hypot(dx,dy),max=r.width/2-24;
    if(d>max){ dx*=max/d; dy*=max/d; d=max; }
    stick.dx=dx/max; stick.dy=dy/max;
    knob.style.transform="translate("+dx+"px,"+dy+"px)";
  }
})();

function collide(nx,nz){
  var R=0.42;
  for(var i=0;i<colliders.length;i++){
    var c=colliders[i];
    if(nx>c.x-c.hw-R && nx<c.x+c.hw+R && nz>c.z-c.hh-R && nz<c.z+c.hh+R) return true;
  }
  return false;
}

function stepMe(dt){
  var mx=0,mz=0;
  if(keys.w||keys.arrowup) mz+=1;
  if(keys.s||keys.arrowdown) mz-=1;
  if(keys.a||keys.arrowleft) mx-=1;
  if(keys.d||keys.arrowright) mx+=1;
  if(stick.active){ mx+=stick.dx; mz-=stick.dy; }
  var len=Math.hypot(mx,mz);
  if(len<0.05) return false;
  mx/=len; mz/=len;

  var fx=Math.sin(camYaw), fz=Math.cos(camYaw);
  var rx=Math.cos(camYaw), rz=-Math.sin(camYaw);
  var dx=(fx*mz+rx*mx), dz=(fz*mz+rz*mx);
  var sp=me.speed*dt;
  var nx=me.x+dx*sp, nz=me.z+dz*sp;

  if(!collide(nx,me.z)) me.x=nx;
  if(!collide(me.x,nz)) me.z=nz;
  var d=Math.hypot(me.x,me.z);
  if(d>32){ me.x*=32/d; me.z*=32/d; }

  var want=Math.atan2(dx,dz);
  var diff=want-me.ry;
  while(diff>PI) diff-=PI*2;
  while(diff<-PI) diff+=PI*2;
  me.ry+=diff*Math.min(1,dt*12);
  return true;
}

function updateCamera(){
  var cy=Math.cos(camPitch),sy=Math.sin(camPitch);
  camera.position.set(
    me.x-Math.sin(camYaw)*camDist*cy,
    1.5+camDist*sy,
    me.z-Math.cos(camYaw)*camDist*cy);
  camera.lookAt(me.x,1.3,me.z);
}

/* 지금 어디인가 */
function whereAmI(){
  var d=Math.hypot(me.x,me.z);
  if(d<HALL_R) return {t:"중앙 홀",s:"모두가 모이는 곳"};
  for(var i=0;i<MAXP;i++){
    var c=roomCenter(i);
    if(Math.hypot(me.x-c.x,me.z-c.z)<Math.max(ROOM_W,ROOM_L)/2+0.4)
      return {t:(i+1)+"호실",s:(NET.roomOwner[i]||"비어 있음")};
  }
  return {t:"복도",s:""};
}

/* ================= 네트워크 ================= */
var NET={mode:null,code:"",peer:null,conn:null,conns:{},me:"",slot:0,
         players:[],roomOwner:{},connected:false};

function myLink(){
  return location.href.split("#")[0].split("?")[0]+"?r="+NET.code;
}
(function(){
  var m=location.search.match(/[?&]r=([A-Za-z0-9]{4})/);
  if(m) $("inCode").value=m[1].toUpperCase();
  try{ var n=localStorage.getItem("room8_name"); if(n) $("inName").value=n; }catch(e){}
})();

function fail(msg){
  $("stepName").classList.add("hidden");
  $("stepLobby").classList.add("hidden");
  $("stepErr").classList.remove("hidden");
  $("errMsg").innerHTML="<b>연결 실패</b><br>"+esc(msg);
}

$("btnHost").onclick=function(){
  var n=($("inName").value||"").trim().slice(0,8);
  if(!n){ alert("이름을 입력하세요."); return; }
  NET.me=n; saveName(n);
  hostOpen();
};
$("btnJoin").onclick=function(){
  var n=($("inName").value||"").trim().slice(0,8);
  var c=($("inCode").value||"").trim().toUpperCase();
  if(!n){ alert("이름을 입력하세요."); return; }
  if(c.length!==4){ alert("방 번호 4자리를 입력하세요."); return; }
  NET.me=n; NET.code=c; saveName(n);
  clientOpen();
};
function saveName(n){ try{ localStorage.setItem("room8_name",n); }catch(e){} }

/* ---- 방장 ---- */
function hostOpen(){
  NET.mode="host";
  NET.code=mkCode();
  NET.players=[{name:NET.me,slot:0,online:true,x:0,z:HALL_R*0.55,ry:0}];
  NET.roomOwner={0:NET.me};
  showLobby();
  var peer=new Peer(pid(NET.code),{debug:1});
  NET.peer=peer;
  peer.on("open",function(){ NET.connected=true; net("방 열림 · "+NET.code); showLobby(); });
  peer.on("error",function(e){
    if(e.type==="unavailable-id"){ try{peer.destroy();}catch(x){} hostOpen(); return; }
    net("오류: "+(e.type||e),true);
  });
  peer.on("connection",function(c){
    c.on("open",function(){ NET.conns[c.peer]=c; });
    c.on("data",function(m){ hostMsg(c,m); });
    c.on("close",function(){
      delete NET.conns[c.peer];
      NET.players.forEach(function(p){ if(p.cid===c.peer) p.online=false; });
      hostBroadcast(); showLobby();
    });
  });
}

function hostMsg(c,m){
  if(m.t==="join"){
    var nm=String(m.name||"").slice(0,8)||"이름없음";
    var p=null;
    NET.players.forEach(function(q){ if(q.name===nm) p=q; });
    if(!p){
      if(NET.players.length>=MAXP){ c.send({t:"deny",why:"정원(8명)이 찼습니다."}); return; }
      p={name:nm,slot:NET.players.length,online:true,x:0,z:HALL_R*0.7,ry:0};
      NET.players.push(p);
      NET.roomOwner[p.slot]=nm;
    }
    p.cid=c.peer; p.online=true;
    c.send({t:"hello",slot:p.slot,code:NET.code});
    hostBroadcast(); showLobby();
    return;
  }
  if(m.t==="pos"){
    NET.players.forEach(function(p){
      if(p.cid===c.peer){ p.x=m.x; p.z=m.z; p.ry=m.ry; }
    });
  }
}

function hostBroadcast(){
  var snap={t:"world",players:NET.players.map(function(p){
    return {name:p.name,slot:p.slot,online:p.online,x:p.x,z:p.z,ry:p.ry};
  })};
  Object.keys(NET.conns).forEach(function(k){
    var c=NET.conns[k];
    if(c&&c.open){ try{ c.send(snap); }catch(e){} }
  });
}

/* ---- 참가자 ---- */
function clientOpen(){
  NET.mode="client";
  showLobby();
  var peer=new Peer({debug:1});
  NET.peer=peer;
  peer.on("open",function(){
    var c=peer.connect(pid(NET.code),{reliable:true});
    NET.conn=c;
    c.on("open",function(){ NET.connected=true; net("접속됨"); c.send({t:"join",name:NET.me}); });
    c.on("data",function(m){ clientMsg(m); });
    c.on("close",function(){ NET.connected=false; net("연결 끊김 — 새로고침 후 같은 이름으로",true); });
  });
  peer.on("error",function(e){
    fail("방 번호가 맞는지, 방장이 방을 열어뒀는지 확인하세요. ("+(e.type||e)+")");
  });
}

function clientMsg(m){
  if(m.t==="deny"){ fail(m.why); return; }
  if(m.t==="hello"){ NET.slot=m.slot; return; }
  if(m.t==="world"){
    NET.players=m.players;
    NET.roomOwner={};
    m.players.forEach(function(p){ NET.roomOwner[p.slot]=p.name; });
    showLobby();
    return;
  }
}

function net(s,bad){ var e=$("net"); if(e){ e.textContent=s; e.className=bad?"bad":""; } }

/* ---- 로비 ---- */
function showLobby(){
  $("stepName").classList.add("hidden");
  $("stepLobby").classList.remove("hidden");
  $("codeCard").classList.toggle("hidden",NET.mode!=="host");
  $("codeTxt").textContent=NET.code||"----";
  $("linkTxt").textContent=myLink();
  var h="";
  NET.players.forEach(function(p){
    h+='<div class="prow"><span class="dot" style="background:#'+
      ("000000"+ROOM_COLORS[p.slot%8].toString(16)).slice(-6)+'"></span>'+
      '<span class="nm">'+esc(p.name)+(p.name===NET.me?" (나)":"")+'</span>'+
      '<span class="chip">'+(p.slot+1)+'호실</span>'+
      (p.online?"":'<span class="chip">끊김</span>')+'</div>';
  });
  if(!h) h='<div class="muted">아직 아무도 없습니다.</div>';
  $("lobbyList").innerHTML=h;
}

$("btnCopy").onclick=function(){
  var t=document.createElement("textarea");
  t.value=myLink(); t.style.position="fixed"; t.style.top="-2000px";
  document.body.appendChild(t); t.select(); t.setSelectionRange(0,99999);
  try{ document.execCommand("copy"); $("copied").textContent="복사됐습니다"; }catch(e){}
  document.body.removeChild(t);
  setTimeout(function(){ $("copied").textContent=""; },1600);
};

$("btnEnter").onclick=function(){
  $("cover").classList.add("hidden");
  $("hud").classList.remove("hidden");
  // 내 방 앞에서 시작
  var slot=(NET.mode==="host")?0:NET.slot;
  var c=roomCenter(slot);
  me.x=c.x*0.62; me.z=c.z*0.62;
  camYaw=Math.atan2(-c.x,-c.z);
  started=true;
};

/* ================= 루프 ================= */
var started=false,lastSend=0;

function syncAvatars(){
  var seen={};
  NET.players.forEach(function(p){
    if(p.name===NET.me) return;
    seen[p.name]=1;
    var a=avatars[p.name];
    if(!a){ a=avatars[p.name]=makeAvatar(p.name,p.slot); a.group.position.set(p.x,0,p.z); }
    a.tx=p.x; a.tz=p.z; a.try_=p.ry;
    a.group.visible=p.online!==false;
  });
  Object.keys(avatars).forEach(function(n){
    if(!seen[n]){ scene.remove(avatars[n].group); delete avatars[n]; }
  });
}

function tick(){
  requestAnimationFrame(tick);
  var dt=Math.min(0.05,clock.getDelta());

  if(started){
    var moving=stepMe(dt);
    if(meMesh){
      meMesh.group.position.set(me.x,0,me.z);
      meMesh.group.rotation.y=me.ry;
      bob(meMesh,moving,dt);
    }
    updateCamera();

    // 위치 송신 (초당 약 12회)
    lastSend+=dt;
    if(lastSend>0.08){
      lastSend=0;
      if(NET.mode==="client"&&NET.conn&&NET.conn.open){
        try{ NET.conn.send({t:"pos",x:+me.x.toFixed(2),z:+me.z.toFixed(2),ry:+me.ry.toFixed(2)}); }catch(e){}
      } else if(NET.mode==="host"){
        NET.players[0].x=me.x; NET.players[0].z=me.z; NET.players[0].ry=me.ry;
        hostBroadcast();
      }
    }

    // 원격 아바타 보간
    Object.keys(avatars).forEach(function(n){
      var a=avatars[n],g=a.group;
      var mv=Math.hypot(a.tx-g.position.x,a.tz-g.position.z)>0.02;
      g.position.x+=(a.tx-g.position.x)*Math.min(1,dt*12);
      g.position.z+=(a.tz-g.position.z)*Math.min(1,dt*12);
      var d=a.try_-g.rotation.y;
      while(d>PI) d-=PI*2; while(d<-PI) d+=PI*2;
      g.rotation.y+=d*Math.min(1,dt*12);
      bob(a,mv,dt);
    });

    var w=whereAmI();
    $("where").innerHTML=esc(w.t)+(w.s?"<small>"+esc(w.s)+"</small>":"");
    renderRoster();
  }
  renderer.render(scene,camera);
}

function bob(a,moving,dt){
  a.phase=(a.phase||0)+(moving?dt*9:0);
  var s=moving?Math.abs(Math.sin(a.phase))*0.06:0;
  if(a.body) a.body.position.y=0.94+s;
  if(a.legs) a.legs.rotation.x=moving?Math.sin(a.phase*2)*0.5:0;
}

var rosterCache="";
function renderRoster(){
  var h="";
  NET.players.forEach(function(p){
    h+='<div class="rchip'+(p.online===false?" off":"")+'">'+
      '<span class="dot" style="background:#'+("000000"+ROOM_COLORS[p.slot%8].toString(16)).slice(-6)+'"></span>'+
      esc(p.name)+(p.name===NET.me?" (나)":"")+'</div>';
  });
  if(h!==rosterCache){ rosterCache=h; $("roster").innerHTML=h; }
}

/* ================= 시작 ================= */
initScene();
setInterval(syncAvatars,120);
(function(){
  // 내 아바타는 접속 후 슬롯이 정해지면 만든다
  var iv=setInterval(function(){
    if(!started) return;
    if(meMesh){ clearInterval(iv); return; }
    var slot=(NET.mode==="host")?0:NET.slot;
    meMesh=makeAvatar(NET.me,slot);
  },200);
})();
tick();
</script>
