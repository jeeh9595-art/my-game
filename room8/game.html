<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>8호실</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:#0d1015;color:#e3e9ed;overflow:hidden;
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
       -webkit-tap-highlight-color:transparent;}
  canvas#view{display:block;width:100vw;height:100vh;touch-action:none;}

  .cover{position:fixed;inset:0;z-index:60;background:#0d1015;overflow-y:auto;}
  .wrap{max-width:520px;margin:0 auto;padding:32px 18px 60px;}
  h1{font-size:30px;letter-spacing:8px;margin:0 0 4px;}
  .tag{font-size:12px;color:#7d8894;margin-bottom:24px;letter-spacing:1px;}
  .card{background:#161b21;border:1px solid #232b33;border-radius:12px;padding:15px 16px;margin-bottom:12px;}
  h2{font-size:11.5px;letter-spacing:2px;color:#7d8894;text-transform:uppercase;font-weight:500;margin:0 0 11px;}
  input{font:inherit;font-size:16px;background:#11161b;color:#e3e9ed;border:1px solid #2a323b;
        border-radius:9px;padding:11px 12px;width:100%;}
  button{font:inherit;font-size:15px;border:none;border-radius:9px;padding:11px 18px;
         background:#4c7dfc;color:#fff;cursor:pointer;}
  button.w{width:100%;}
  button.ghost{background:#2c343d;}
  button.sm{font-size:13px;padding:7px 13px;}
  button:active{transform:translateY(1px);}
  button:disabled{background:#242b33;color:#5b646d;}
  .muted{color:#7d8894;font-size:12.5px;line-height:1.75;}
  .note{background:#1b2128;border-left:3px solid #45c2b7;border-radius:0 8px 8px 0;
        padding:11px 14px;font-size:13.5px;color:#c3ccd5;margin-bottom:12px;}
  .note b{color:#45c2b7;}
  .note.y{border-left-color:#d9a441;} .note.y b{color:#d9a441;}
  .note.r{border-left-color:#e8695e;background:#35201e;color:#f0c9c5;} .note.r b{color:#e8695e;}
  .code{font-size:40px;letter-spacing:11px;font-weight:700;text-align:center;color:#ffd75e;
        background:#11161b;border:1px solid #2a323b;border-radius:12px;padding:11px 4px 11px 16px;margin-bottom:9px;}
  .linkbox{font-size:11.5px;color:#8b95a0;word-break:break-all;background:#11161b;
           border:1px solid #2a323b;border-radius:9px;padding:9px 11px;margin-bottom:8px;}
  .plist{display:flex;flex-direction:column;gap:6px;}
  .prow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;background:#1b2128;}
  .dot{width:13px;height:13px;border-radius:50%;flex:none;}
  .prow .nm{flex:1;font-size:14px;}
  .chip{font-size:10.5px;letter-spacing:1px;padding:2px 8px;border-radius:5px;background:#2a323b;color:#98a4b0;}
  .chip.ok{background:#12302e;color:#45c2b7;}
  .chip.iso{background:#3a3016;color:#d9a441;}
  .chip.dead{background:#35201e;color:#e8695e;}
  .chip.tr{background:#35201e;color:#e8695e;}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #top{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;}
  #roster{display:flex;flex-direction:column;gap:4px;}
  .rchip{display:flex;align-items:center;gap:7px;background:rgba(13,16,21,.74);
         border-radius:7px;padding:4px 9px;font-size:12.5px;}
  .rchip .dot{width:10px;height:10px;}
  .rchip.off{opacity:.4;} .rchip.dead{opacity:.4;text-decoration:line-through;}
  #center{flex:1;text-align:center;}
  #phase{font-size:17px;letter-spacing:3px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9);}
  #timer{font-size:26px;font-variant-numeric:tabular-nums;color:#ffd75e;
         text-shadow:0 2px 10px rgba(0,0,0,.9);line-height:1.15;}
  #timer.warn{color:#ff6b6b;}
  #sub{font-size:12px;color:#aab3bd;text-shadow:0 1px 6px rgba(0,0,0,.9);}
  #right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto;}
  #right button{background:rgba(13,16,21,.78);border:1px solid #2a323b;font-size:12.5px;padding:6px 11px;}
  #right button.on{background:#12302e;border-color:#45c2b7;color:#45c2b7;}
  #where{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:13px;
         color:#c3ccd5;text-shadow:0 1px 8px rgba(0,0,0,.9);}
  #hint{position:absolute;bottom:32px;left:0;right:0;text-align:center;font-size:12px;color:#8b95a0;}
  #stick{position:absolute;left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;
         background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
         pointer-events:auto;display:none;}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
           border-radius:50%;background:rgba(255,255,255,.25);}
  #flash{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .45s;}

  /* 하단 패널 */
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:88vh;overflow-y:auto;
         background:#12161c;border-top:1px solid #232b33;border-radius:16px 16px 0 0;
         padding:14px 15px 22px;transform:translateY(101%);transition:transform .22s;}
  #panel.open{transform:translateY(0);}
  #panel .grip{width:44px;height:4px;border-radius:3px;background:#2f3841;margin:0 auto 12px;}
  .pwrap{max-width:620px;margin:0 auto;}
  .mission{background:#11161b;border:1px solid #2a323b;border-radius:10px;padding:11px 13px;margin-bottom:10px;}
  .mission .to{font-size:13px;color:#8b95a0;}
  .mission .wd{font-size:28px;font-weight:700;letter-spacing:2px;color:#ffd75e;line-height:1.3;}
  .mission .wd.fake{color:#e8695e;}
  canvas.pad{display:block;width:100%;max-width:360px;aspect-ratio:1/1;background:#fff;
             border-radius:11px;touch-action:none;margin:0 auto;}
  .tools{display:flex;gap:7px;align-items:center;margin-top:9px;flex-wrap:wrap;}
  .words{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;}
  .w{background:#11161b;border:1px solid #2a323b;border-radius:8px;padding:7px 9px;}
  .w .t{font-size:14px;font-weight:600;}
  .w .o{font-size:10.5px;color:#6f7a86;}
  .w.mine{border-color:#3d4c5c;}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;}
  .gitem{background:#fff;border-radius:10px;overflow:hidden;}
  .gitem canvas{display:block;width:100%;aspect-ratio:1/1;}
  .gitem .cap{background:#161b21;color:#a2aeb8;font-size:11.5px;padding:5px 8px;text-align:center;}
  .vlist{display:flex;flex-direction:column;gap:7px;}
  .vbtn{background:#1b2128;border:1px solid #2a323b;border-radius:9px;padding:11px 13px;
        text-align:left;color:#e3e9ed;font-size:15px;width:100%;}
  .vbtn.sel{border-color:#4c7dfc;background:#1c2740;}
  .guess{display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:center;margin-bottom:7px;}
  .guess .lb{font-size:12.5px;color:#7d8894;}
  select{font:inherit;font-size:15px;background:#11161b;color:#e3e9ed;border:1px solid #2a323b;
         border-radius:9px;padding:9px 10px;width:100%;}
  .thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;}
  .thbtn{background:#1b2128;border:1px solid #2a323b;border-radius:9px;padding:11px 6px;
         color:#e3e9ed;font-size:14.5px;width:100%;}
  .thbtn.sel{border-color:#4c7dfc;background:#1c2740;}
  .thbtn small{display:block;color:#7d8894;font-size:11px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 8px;border-bottom:1px solid #232b33;text-align:left;}
  th{font-size:10.5px;letter-spacing:1px;color:#7d8894;background:#1b2128;font-weight:500;}
  .tw{overflow-x:auto;border:1px solid #232b33;border-radius:9px;}
  .ok{color:#6ee7a0;} .bad{color:#ff7b7b;}
  .big{font-size:24px;font-weight:700;letter-spacing:3px;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="top">
    <div id="roster"></div>
    <div id="center">
      <div id="phase"></div>
      <div id="timer"></div>
      <div id="sub"></div>
    </div>
    <div id="right">
      <button id="btnBoard">단어판</button>
      <button id="btnGal">받은 그림</button>
      <button id="btnMic">마이크 끔</button>
      <button id="btnHostNext" class="hidden">다음 단계</button>
    </div>
  </div>
  <div id="where"></div>
  <div id="hint"></div>
  <div id="stick"><i></i></div>
  <div id="flash"></div>
</div>

<div id="panel"><div class="grip"></div><div class="pwrap" id="pbody"></div></div>

<!-- ===== 입장 ===== -->
<div class="cover" id="cover">
  <div class="wrap">
    <h1>8호실</h1>
    <div class="tag">5~8인 소셜 추리 · 웹 빌드</div>

    <div id="stepName">
      <div class="card"><h2>이름</h2>
        <input id="inName" placeholder="게임에서 쓸 이름" maxlength="8" autocomplete="off"></div>
      <div class="card"><h2>참가하기</h2>
        <input id="inCode" placeholder="방 번호 4자리" maxlength="4" autocomplete="off"
               style="text-transform:uppercase;letter-spacing:6px;text-align:center;margin-bottom:9px;">
        <button class="w" id="btnJoin">방 들어가기</button></div>
      <div class="card"><h2>방 만들기</h2>
        <div class="muted" style="margin-bottom:10px;">방장도 같이 플레이합니다. 방장이 나가면 방이 닫힙니다.</div>
        <button class="w ghost" id="btnHost">새 방 만들기</button></div>
      <div class="muted" style="text-align:center;"><a href="./" style="color:#7d8894;">← 규칙 보기</a></div>
    </div>

    <div id="stepLobby" class="hidden">
      <div class="card hidden" id="codeCard"><h2>방 번호</h2>
        <div class="code" id="codeTxt">----</div>
        <div class="linkbox" id="linkTxt"></div>
        <button class="w ghost" id="btnCopy">링크 복사</button>
        <div class="muted" id="copied" style="margin-top:7px;"></div></div>
      <div class="card"><h2>들어온 사람</h2><div class="plist" id="lobbyList"></div></div>
      <div class="card"><button class="w" id="btnEnter">공간으로 들어가기</button>
        <div class="muted" style="margin-top:9px;" id="lobbyHint">
          먼저 공간에 들어간 뒤, 방장이 시작하면 게임이 진행됩니다.</div></div>
    </div>

    <div id="stepErr" class="hidden">
      <div class="card"><div class="note r" id="errMsg"></div>
      <button class="w" onclick="location.reload()">처음으로</button></div>
    </div>
  </div>
</div>

<script src="lib/three147.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/SkeletonUtils.js"></script>
<script src="peerjs.min.js"></script>
<script src="rules.js"></script>
<script>
"use strict";
var RL=window.Room8Rules;
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ri(n){return (Math.random()*n)|0;}
function rnd(){return Math.random();}
var PI=Math.PI;
var ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function mkCode(){var s="";for(var i=0;i<4;i++)s+=ALPHA[ri(ALPHA.length)];return s;}
function pid(c){return "room8-g-"+c;}
function hex(c){return "#"+("000000"+c.toString(16)).slice(-6);}

var ROOM_COLORS=[0xe0483e,0xe8912f,0xd8c22b,0x5fa83e,0x2e9b63,0x3d9fd1,0x2f4b87,0x8b5bc4];
var MAXP=8;

/* ============ 공간 ============ */
var HALL_R=10, ROOM_D=17.5, ROOM_W=6.6, ROOM_L=6.2, DOOR_W=2.6, WALL_H=3.2, WALL_T=0.35;
var scene,camera,renderer,clock,hemi,hallLamp,roomLights=[],doors=[],consoles=[];
var colliders=[], avatars={}, meMesh=null, hallScreen=null;
var MAILBOX=[], mailMesh=[], objMesh={}, OBJS=[];
var HAND_F=0.50, HAND_H=1.00;   // 손 위치(앞으로, 높이)

function roomAngle(i){ return -PI/2+i*(PI*2/MAXP); }
function roomCenter(i){ var a=roomAngle(i); return {x:Math.cos(a)*ROOM_D,z:Math.sin(a)*ROOM_D,a:a}; }

function initScene(){
  renderer=new THREE.WebGLRenderer({canvas:$("view"),antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  try{
    if(THREE.sRGBEncoding!==undefined) renderer.outputEncoding=THREE.sRGBEncoding;
    if(THREE.ACESFilmicToneMapping!==undefined){
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure=1.08;
    }
  }catch(e){}
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0d1015);
  scene.fog=new THREE.Fog(0x0d1015,26,60);
  camera=new THREE.PerspectiveCamera(52,1,0.1,140);
  clock=new THREE.Clock();

  hemi=new THREE.HemisphereLight(0xc8d4e4,0x1a1f27,0.62); scene.add(hemi);
  var sun=new THREE.DirectionalLight(0xffffff,0.7);
  sun.position.set(14,26,10); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-34; sun.shadow.camera.right=34;
  sun.shadow.camera.top=34; sun.shadow.camera.bottom=-34;
  sun.shadow.camera.far=72; sun.shadow.bias=-0.0008;
  scene.add(sun);
  // 반대편 채움광 — 그림자 쪽이 새까맣지 않게
  var fill=new THREE.DirectionalLight(0x9fb6d4,0.28);
  fill.position.set(-16,12,-14); scene.add(fill);

  var g=new THREE.Mesh(new THREE.CircleGeometry(34,72),
    new THREE.MeshStandardMaterial({color:0x2c333c,roughness:0.95}));
  g.rotation.x=-PI/2; g.receiveShadow=true; scene.add(g);
  var grid=new THREE.GridHelper(68,68,0x394250,0x333b46);
  grid.position.y=0.01; scene.add(grid);

  buildHall();
  for(var i=0;i<MAXP;i++) buildRoom(i);
  window.addEventListener("resize",resize); resize();
}
function resize(){
  renderer.setSize(window.innerWidth,window.innerHeight,false);
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
}
function addCol(x,z,hw,hh,door){ colliders.push({x:x,z:z,hw:hw,hh:hh,door:door}); }

function buildHall(){
  var f=new THREE.Mesh(new THREE.CircleGeometry(HALL_R,64),
    new THREE.MeshStandardMaterial({color:0x3a434f,roughness:0.9}));
  f.rotation.x=-PI/2; f.position.y=0.02; f.receiveShadow=true; scene.add(f);
  var ring=new THREE.Mesh(new THREE.RingGeometry(HALL_R-0.2,HALL_R,80),
    new THREE.MeshBasicMaterial({color:0x5b6675,side:THREE.DoubleSide}));
  ring.rotation.x=-PI/2; ring.position.y=0.03; scene.add(ring);

  var p=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.35,3.2,20),
    new THREE.MeshStandardMaterial({color:0x4a5462,roughness:0.7}));
  p.position.y=1.6; p.castShadow=true; p.receiveShadow=true; scene.add(p);
  addCol(0,0,1.4,1.4);

  hallScreen=makeScreen(3.4,1.7);
  hallScreen.position.set(0,3.9,0);
  scene.add(hallScreen);
  var s2=hallScreen.clone(); s2.rotation.y=PI; s2.position.set(0,3.9,0); scene.add(s2);
  hallScreen.userData.twin=s2;

  hallLamp=new THREE.PointLight(0xffd9a0,1.0,30,2);
  hallLamp.position.set(0,5.6,0); scene.add(hallLamp);
  var bulb=new THREE.Mesh(new THREE.SphereGeometry(0.3,14,10),
    new THREE.MeshBasicMaterial({color:0xffe6c0}));
  bulb.position.set(0,5.6,0); scene.add(bulb);
}

/* 캔버스 텍스처 화면 */
function makeScreen(w,h){
  var c=document.createElement("canvas"); c.width=512; c.height=256;
  var t=new THREE.CanvasTexture(c);
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:t,transparent:true}));
  m.userData.cv=c; m.userData.tex=t;
  paintScreen(m,"8호실","");
  return m;
}
function paintScreen(m,title,sub,color){
  var c=m.userData.cv,x=c.getContext("2d");
  x.clearRect(0,0,512,256);
  x.fillStyle="rgba(10,13,17,.86)";
  x.fillRect(0,0,512,256);
  x.strokeStyle=color||"#45c2b7"; x.lineWidth=5; x.strokeRect(3,3,506,250);
  x.textAlign="center"; x.fillStyle="#fff";
  x.font="bold 62px system-ui,sans-serif"; x.fillText(title,256,110);
  if(sub){ x.fillStyle=color||"#9fb0bd"; x.font="34px system-ui,sans-serif"; x.fillText(sub,256,175); }
  m.userData.tex.needsUpdate=true;
  if(m.userData.twin){
    var t2=m.userData.twin;
    t2.material.map=m.userData.tex; t2.material.needsUpdate=true;
  }
}

function buildRoom(i){
  var c=roomCenter(i), col=ROOM_COLORS[i];
  var g=new THREE.Group();
  g.position.set(c.x,0,c.z); g.rotation.y=-c.a;
  scene.add(g);

  var f=new THREE.Mesh(new THREE.PlaneGeometry(ROOM_L,ROOM_W),
    new THREE.MeshStandardMaterial({color:0x39424e,roughness:0.95}));
  f.rotation.x=-PI/2; f.position.y=0.02; f.receiveShadow=true; g.add(f);
  var strip=new THREE.Mesh(new THREE.PlaneGeometry(0.5,ROOM_W),
    new THREE.MeshBasicMaterial({color:col}));
  strip.rotation.x=-PI/2; strip.position.set(-ROOM_L/2+0.26,0.04,0); g.add(strip);

  var wallMat=new THREE.MeshStandardMaterial({color:0x525c6a,roughness:0.9});
  function wall(w,d,x,z){
    var m=new THREE.Mesh(new THREE.BoxGeometry(w,WALL_H,d),wallMat);
    m.position.set(x,WALL_H/2,z); m.castShadow=true; m.receiveShadow=true; g.add(m);
    var wp=new THREE.Vector3(x,0,z); g.localToWorld(wp);
    var ca=Math.abs(Math.cos(c.a)),sa=Math.abs(Math.sin(c.a));
    addCol(wp.x,wp.z,(w*ca+d*sa)/2,(w*sa+d*ca)/2);
  }
  wall(WALL_T,ROOM_W, ROOM_L/2,0);
  wall(ROOM_L,WALL_T, 0, ROOM_W/2);
  wall(ROOM_L,WALL_T, 0,-ROOM_W/2);
  var side=(ROOM_W-DOOR_W)/2;
  wall(WALL_T,side, -ROOM_L/2, (ROOM_W-side)/2);
  wall(WALL_T,side, -ROOM_L/2,-(ROOM_W-side)/2);

  [1,-1].forEach(function(s){
    var j=new THREE.Mesh(new THREE.BoxGeometry(0.42,WALL_H,0.42),
      new THREE.MeshStandardMaterial({color:col,roughness:0.6}));
    j.position.set(-ROOM_L/2,WALL_H/2,s*DOOR_W/2); j.castShadow=true; g.add(j);
  });

  // 문 (밤에 닫힘)
  var door=new THREE.Mesh(new THREE.BoxGeometry(0.16,WALL_H-0.2,DOOR_W),
    new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:0.55,roughness:0.4}));
  door.position.set(-ROOM_L/2,(WALL_H-0.2)/2,0); door.visible=false; g.add(door);
  doors[i]=door;
  var dp=new THREE.Vector3(-ROOM_L/2,0,0); g.localToWorld(dp);
  var ca2=Math.abs(Math.cos(c.a)),sa2=Math.abs(Math.sin(c.a));
  addCol(dp.x,dp.z,(0.3*ca2+DOOR_W*sa2)/2,(0.3*sa2+DOOR_W*ca2)/2,i);

  // 콘솔 (뒷벽 화면)
  var scr=makeScreen(2.6,1.3);
  scr.position.set(ROOM_L/2-0.22,1.85,0); scr.rotation.y=-PI/2;
  g.add(scr); consoles[i]=scr;
  paintScreen(scr,(i+1)+"호실","",hex(col));

  var desk=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.85,2.2),
    new THREE.MeshStandardMaterial({color:0x45505e,roughness:0.85}));
  desk.position.set(ROOM_L/2-0.55,0.43,0); desk.castShadow=true; desk.receiveShadow=true; g.add(desk);
  var wp2=new THREE.Vector3(ROOM_L/2-0.55,0,0); g.localToWorld(wp2);
  addCol(wp2.x,wp2.z,(0.6*ca2+2.2*sa2)/2,(0.6*sa2+2.2*ca2)/2);

  var num=makeLabel(String(i+1),col,120);

/* 월드 기준 축으로 뼈를 돌린다 (본의 로컬 축 방향을 몰라도 된다) */
var _qP=new THREE.Quaternion(), _qA=new THREE.Quaternion(), _qD=new THREE.Quaternion();
function worldSpin(b,axis,ang){
  if(!b||!b.parent||!ang) return;
  b.parent.getWorldQuaternion(_qP);
  _qA.setFromAxisAngle(axis,ang);
  _qD.copy(_qP).invert().multiply(_qA).multiply(_qP);
  b.quaternion.premultiply(_qD);
}

var me={x:0,z:HALL_R*0.5,ry:0,y:0,vy:0,ground:true,mode:0,punch:0,pc:0,kx:0,kz:0,hold:-1,
        vx:0,vz:0,land:0,emote:0,emoteT:0,speed:0,
        walk:4.2,run:7.4,jumpV:5.6,grav:15.5};
var camYaw=0,camPitch=0.42,camDist=7.2;
var keys={},started=false;

window.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(document.activeElement&&/input|select|textarea/i.test(document.activeElement.tagName)) return;
  if(k==="e"&&!keys.e) doInteract();
  if(k==="c"&&!keys.c) setEmote(me.emote===1?0:1);
  if(k==="v"&&!keys.v) setEmote(2);
  if(k==="b"&&!keys.b) setEmote(3);
  keys[k]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].indexOf(k)>=0) e.preventDefault();
});
window.addEventListener("keyup",function(e){ keys[e.key.toLowerCase()]=false; });
window.addEventListener("blur",function(){ keys={}; });

var dragging=false,lastX=0,lastY=0,dragId=-1;
(function(){
  var cv=$("view");
  var downT=0,downX=0,downY=0;
  cv.addEventListener("pointerdown",function(e){
    dragging=true; dragId=e.pointerId; lastX=e.clientX; lastY=e.clientY;
    downT=Date.now(); downX=e.clientX; downY=e.clientY;
    cv.setPointerCapture(e.pointerId);
    if(e.pointerType==="mouse"&&e.button===0) primaryAction();
  });
  cv.addEventListener("pointermove",function(e){
    if(!dragging||e.pointerId!==dragId) return;
    camYaw-=(e.clientX-lastX)*0.005;
    camPitch=Math.max(0.08,Math.min(1.05,camPitch+(e.clientY-lastY)*0.004));
    lastX=e.clientX; lastY=e.clientY;
  });
  function up(e){
    if(e&&e.pointerId!==dragId) return;
    if(e&&e.pointerType&&e.pointerType!=="mouse"){
      var moved=Math.hypot(e.clientX-downX,e.clientY-downY);
      if(moved<12&&Date.now()-downT<260) primaryAction();
    }
    dragging=false; dragId=-1;
  }
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",function(e){
    e.preventDefault();
    camDist=Math.max(3.4,Math.min(16,camDist+(e.deltaY>0?0.6:-0.6)));
  },{passive:false});
})();

var stick={active:false,id:-1,dx:0,dy:0};
(function(){
  var el=$("stick"),knob=el.querySelector("i");
  if(!("ontouchstart" in window)) return;
  el.style.display="block";
  el.addEventListener("pointerdown",function(e){ stick.active=true; stick.id=e.pointerId; el.setPointerCapture(e.pointerId); mv(e); });
  el.addEventListener("pointermove",function(e){ if(stick.active&&e.pointerId===stick.id) mv(e); });
  function up(e){ if(e.pointerId!==stick.id) return; stick.active=false; stick.dx=0; stick.dy=0; knob.style.transform=""; }
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  function mv(e){
    var r=el.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
    var d=Math.hypot(dx,dy),max=r.width/2-23;
    if(d>max){ dx*=max/d; dy*=max/d; }
    stick.dx=dx/max; stick.dy=dy/max;
    knob.style.transform="translate("+dx+"px,"+dy+"px)";
  }
})();

var doorsClosed=false;
function collide(nx,nz){
  var Rr=0.42;
  for(var i=0;i<colliders.length;i++){
    var c=colliders[i];
    if(c.door!==undefined){
      if(!doorsClosed) continue;
      if(c.door===mySlot()) continue;
    }
    if(nx>c.x-c.hw-Rr&&nx<c.x+c.hw+Rr&&nz>c.z-c.hh-Rr&&nz<c.z+c.hh+Rr) return true;
  }
  return false;
}

function setEmote(e){
  if(!started) return;
  me.emote=e;
  me.emoteT=(e===2||e===3)?(e===2?2.2:5.0):0;
}

function stepMe(dt){
  var mx=0,mz=0;
  if(keys.w||keys.arrowup) mz+=1;
  if(keys.s||keys.arrowdown) mz-=1;
  if(keys.a||keys.arrowleft) mx-=1;
  if(keys.d||keys.arrowright) mx+=1;
  if(stick.active){ mx+=stick.dx; mz-=stick.dy; }
  var len=Math.hypot(mx,mz);
  var running=!!keys.shift;

  // 감정표현은 움직이면 풀린다
  if(me.emoteT>0){ me.emoteT-=dt; if(me.emoteT<=0&&me.emote!==1) me.emote=0; }
  if(len>0.05&&me.emote){ me.emote=0; me.emoteT=0; }

  // 점프
  if(keys[" "]&&me.ground&&me.emote!==1){ me.vy=me.jumpV; me.ground=false; }
  var wasAir=!me.ground;
  if(!me.ground||me.y>0){
    me.vy-=me.grav*dt;
    me.y+=me.vy*dt;
    if(me.y<=0){
      me.y=0;
      if(wasAir&&me.vy<-3) me.land=Math.min(1,-me.vy/9);
      me.vy=0; me.ground=true;
    }
  }
  if(me.land>0) me.land=Math.max(0,me.land-dt*3.4);

  if(me.punch>0) me.punch=Math.max(0,me.punch-dt/0.32);

  // 밀려남
  if(Math.abs(me.kx)>0.01||Math.abs(me.kz)>0.01){
    var knx=me.x+me.kx*dt, knz=me.z+me.kz*dt;
    if(!collide(knx,me.z)) me.x=knx;
    if(!collide(me.x,knz)) me.z=knz;
    me.kx*=0.86; me.kz*=0.86;
  }

  // 목표 속도 (앉아 있으면 못 움직인다)
  var tvx=0,tvz=0;
  if(len>0.05&&me.emote!==1){
    mx/=len; mz/=len;
    var fx=Math.sin(camYaw),fz=Math.cos(camYaw),rx=-Math.cos(camYaw),rz=Math.sin(camYaw);
    var dx=fx*mz+rx*mx, dz=fz*mz+rz*mx;
    var tsp=running?me.run:me.walk;
    tvx=dx*tsp; tvz=dz*tsp;
  }

  // 가감속 (공중에서는 조작이 둔하다)
  var acc=me.ground?(len>0.05?11:9):2.6;
  me.vx+=(tvx-me.vx)*Math.min(1,dt*acc);
  me.vz+=(tvz-me.vz)*Math.min(1,dt*acc);
  if(Math.abs(me.vx)<0.02) me.vx=0;
  if(Math.abs(me.vz)<0.02) me.vz=0;

  var nx=me.x+me.vx*dt, nz=me.z+me.vz*dt;
  if(!collide(nx,me.z)) me.x=nx; else me.vx*=0.2;
  if(!collide(me.x,nz)) me.z=nz; else me.vz*=0.2;
  var d=Math.hypot(me.x,me.z);
  if(d>31){ me.x*=31/d; me.z*=31/d; }

  me.speed=Math.hypot(me.vx,me.vz);

  // 진행 방향으로 부드럽게 돌기
  if(me.speed>0.35){
    var want=Math.atan2(me.vx,me.vz), diff=want-me.ry;
    while(diff>PI) diff-=PI*2; while(diff<-PI) diff+=PI*2;
    me.ry+=diff*Math.min(1,dt*(9+me.speed));
  }

  me.mode=me.speed<0.45?0:(me.speed<me.walk*1.25?1:2);
  return me.mode>0;
}

function doPunch(){
  if(!started||me.punch>0) return;
  me.punch=1; me.pc=(me.pc+1)%1000;
  var fx=Math.sin(me.ry),fz=Math.cos(me.ry),best=-1,bd=1.9;
  Object.keys(avatars).forEach(function(k){
    var g=avatars[k].group;
    var dx=g.position.x-me.x, dz=g.position.z-me.z;
    var d=Math.hypot(dx,dz);
    if(d>bd||d<0.01) return;
    if((dx/d)*fx+(dz/d)*fz<0.45) return;
    bd=d; best=+k;
  });
  if(best>=0) toHost({t:"hit",target:best});
}
/* ---------- 사물 상호작용 ---------- */
function handPos(){
  return {x:me.x+Math.sin(me.ry)*HAND_F, y:me.y+HAND_H, z:me.z+Math.cos(me.ry)*HAND_F};
}
function nearestObj(maxd){
  var best=null,bd=maxd||1.9;
  for(var i=0;i<OBJS.length;i++){
    var o=OBJS[i];
    if(o[5]>=0) continue;                     // 남이 들고 있음
    var d=Math.hypot(o[2]-me.x,o[4]-me.z);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}
function nearestMailbox(maxd){
  var best=-1,bd=maxd||2.0;
  for(var i=0;i<MAILBOX.length;i++){
    if(!MAILBOX[i]) continue;
    if(!PUB||!PUB.players[i]) continue;
    var d=Math.hypot(MAILBOX[i].x-me.x,MAILBOX[i].z-me.z);
    if(d<bd){ bd=d; best=i; }
  }
  return best;
}
function myHeld(){
  for(var i=0;i<OBJS.length;i++) if(OBJS[i][5]===mySlot()) return OBJS[i];
  return null;
}
function doInteract(){
  if(!started) return;
  var held=myHeld();
  if(held){
    var mb=nearestMailbox();
    if(mb>=0&&held[1]===OT_BOOK){ toHost({t:"mail",room:mb}); return; }
    toHost({t:"drop"}); return;
  }
  var o=nearestObj();
  if(o) toHost({t:"pick",id:o[0]});
}
function primaryAction(){
  if(!started) return;
  if(myHeld()){
    toHost({t:"throw",ry:+me.ry.toFixed(2)});
    return;
  }
  doPunch();
}

function takeHit(fromSlot){
  var a=avatars[fromSlot];
  var sx=1,sz=0;
  if(a){ sx=me.x-a.group.position.x; sz=me.z-a.group.position.z; }
  var d=Math.hypot(sx,sz)||1;
  me.kx=(sx/d)*7.5; me.kz=(sz/d)*7.5;
  if(me.ground){ me.vy=2.6; me.ground=false; }
}
var camPos=new THREE.Vector3(0,3,0), camLook=new THREE.Vector3(0,1.3,0), camFov=52;
function updateCamera(dt){
  dt=dt||0.016;
  var cy=Math.cos(camPitch),sy=Math.sin(camPitch);
  var wantX=me.x-Math.sin(camYaw)*camDist*cy;
  var wantY=1.25+me.y*0.75+camDist*sy;
  var wantZ=me.z-Math.cos(camYaw)*camDist*cy;

  var k=Math.min(1,dt*11);
  camPos.x+=(wantX-camPos.x)*k;
  camPos.y+=(wantY-camPos.y)*k;
  camPos.z+=(wantZ-camPos.z)*k;

  // 착지 반동
  var shake=me.land*0.16;
  camera.position.set(camPos.x,camPos.y-shake,camPos.z);

  var lk=Math.min(1,dt*14);
  camLook.x+=(me.x-camLook.x)*lk;
  camLook.y+=((1.08+me.y)-camLook.y)*lk;
  camLook.z+=(me.z-camLook.z)*lk;
  camera.lookAt(camLook);

  // 달릴 때 화각이 살짝 열린다
  var wantFov=52+Math.min(1,me.speed/me.run)*7;
  camFov+=(wantFov-camFov)*Math.min(1,dt*4);
  if(Math.abs(camera.fov-camFov)>0.05){ camera.fov=camFov; camera.updateProjectionMatrix(); }
}
function inRoom(i){
  var c=roomCenter(i);
  return Math.hypot(me.x-c.x,me.z-c.z)<Math.max(ROOM_W,ROOM_L)/2+0.3;
}
function inHall(){ return Math.hypot(me.x,me.z)<HALL_R; }

var G=null;

/* ---------- 호스트 사물 상태 ---------- */
var OBJID=1;
function hostObjInit(){
  G.objs=[];
  var kinds=[OT_BALL,OT_BOX,OT_CHAIR,OT_PLANT,OT_BARREL,OT_DUCK,OT_PIN,OT_MELON,OT_TIRE,
             OT_BALL,OT_DUCK,OT_BOX,OT_MELON,OT_PIN];
  for(var i=0;i<kinds.length;i++){
    var a=(i/kinds.length)*Math.PI*2+Math.random()*0.4;
    var r=2.6+Math.random()*(HALL_R-3.4);
    var t=kinds[i];
    G.objs.push({id:OBJID++,type:t,
      x:Math.cos(a)*r,y:objRadius(t),z:Math.sin(a)*r,
      vx:0,vy:0,vz:0,held:-1,color:-1,data:null});
  }
}
function hostSpawnBook(ownerSlot,targetSlot,strokes,round){
  var o={id:OBJID++,type:OT_BOOK,x:0,y:1,z:0,vx:0,vy:0,vz:0,
         held:ownerSlot,color:targetSlot,data:{from:ownerSlot,strokes:strokes,round:round}};
  G.objs.push(o);
  return o;
}
function hostObjStep(dt){
  if(!G||!G.objs) return;
  var GR=16;
  for(var i=0;i<G.objs.length;i++){
    var o=G.objs[i];
    if(o.held>=0){
      var p=G.players[o.held];
      if(!p){ o.held=-1; continue; }
      o.x=p.x+Math.sin(p.ry)*HAND_F;
      o.z=p.z+Math.cos(p.ry)*HAND_F;
      o.y=(p.y||0)+HAND_H;
      o.vx=o.vy=o.vz=0;
      continue;
    }
    o.vy-=GR*dt;
    var nx=o.x+o.vx*dt, nz=o.z+o.vz*dt;
    if(!collideAt(nx,o.z)) o.x=nx; else o.vx*=-0.4;
    if(!collideAt(o.x,nz)) o.z=nz; else o.vz*=-0.4;
    o.y+=o.vy*dt;
    var gr=objRadius(o.type);
    if(o.y<=gr){
      o.y=gr;
      if(o.vy<-0.6){ o.vy=-o.vy*0.32; } else { o.vy=0; }
      o.vx*=0.86; o.vz*=0.86;
      if(Math.abs(o.vx)<0.05) o.vx=0;
      if(Math.abs(o.vz)<0.05) o.vz=0;
    }
    var d=Math.hypot(o.x,o.z);
    if(d>31){ o.x*=31/d; o.z*=31/d; o.vx*=-0.3; o.vz*=-0.3; }
  }
}
function collideAt(x,z){
  for(var i=0;i<colliders.length;i++){
    var c=colliders[i];
    if(c.door!==undefined&&!doorsClosed) continue;
    if(x>c.x-c.hw-0.2&&x<c.x+c.hw+0.2&&z>c.z-c.hh-0.2&&z<c.z+c.hh+0.2) return true;
  }
  return false;
}
function hostDropHeld(slot,vx,vy,vz){
  if(!G||!G.objs) return null;
  for(var i=0;i<G.objs.length;i++){
    var o=G.objs[i];
    if(o.held===slot){
      o.held=-1;
      o.vx=vx||0; o.vy=vy||0; o.vz=vz||0;
      return o;
    }
  }
  return null;
}

function mkPlayer(name,slot,cid){
  return {name:name,slot:slot,cid:cid,peerId:"",online:true,role:"citizen",
          iso:0,isoRound:-1,dead:false,wa:"",wb:"",recv:[],answer:null,escaped:false,
          x:0,z:HALL_R*0.5,ry:0};
}
function hostMsg(c,m){
  if(m.t==="join"){
    var nm=String(m.name||"").slice(0,8)||"이름없음";
    var p=null; G.players.forEach(function(q){ if(q.name===nm) p=q; });
    if(!p){
      if(G.phase!=="lobby"){ c.send({t:"deny",why:"이미 시작된 방입니다."}); return; }
      if(G.players.length>=MAXP){ c.send({t:"deny",why:"정원(8명)이 찼습니다."}); return; }
      p=mkPlayer(nm,G.players.length,c.peer); G.players.push(p);
    }
    p.cid=c.peer; p.online=true; p.peerId=m.peerId||"";
    c.send({t:"hello",slot:p.slot,code:NET.code});
    showLobby(); pushAll(); return;
  }
  var pl=null; G.players.forEach(function(p){ if(p.cid===c.peer) pl=p; });
  if(!pl) return;
  if(m.t==="pos"){ pl.x=m.x; pl.z=m.z; pl.ry=m.ry; pl.y=m.y||0; pl.mode=m.m||0; pl.pc=m.pc||0; pl.emote=m.em||0; return; }
  if(m.t==="hit"){
    var tp=G.players[m.target];
    hostDropHeld(m.target,(Math.random()-0.5)*2,3.2,(Math.random()-0.5)*2);
    if(tp&&tp.slot===0) takeHit(pl.slot);
    else if(tp) send(tp,{t:"hit",from:pl.slot});
    return;
  }
  if(m.t==="pick"||m.t==="throw"||m.t==="drop"||m.t==="mail"){ hostObjCmd(pl.slot,m); return; }
  if(m.t==="tvote"){ G.themeVotes[pl.slot]=m.i; pushAll(); return; }
  if(m.t==="words"){ pl.wa=String(m.a||"").trim(); pl.wb=String(m.b||"").trim(); pushAll(); return; }
  if(m.t==="draw"){
    if((G.draws[G.round]||{})[pl.slot]!==undefined) return;
    (G.draws[G.round]=G.draws[G.round]||{})[pl.slot]=m.strokes||[];
    var to=G.miss[G.round-1][pl.slot];
    hostSpawnBook(pl.slot,to,m.strokes||[],G.round);
    pushAll(); return;
  }
  if(m.t==="vote"){ G.votes[pl.slot]=m.target; pushAll(); return; }
  if(m.t==="answer"){ pl.answer=m.arr; pushAll(); return; }
}
function send(p,msg){ var c=NET.conns[p.cid]; if(c&&c.open){ try{c.send(msg);}catch(e){} } }

function hostObjCmd(slot,m){
  if(!G||!G.objs) return;
  var pl=G.players[slot]; if(!pl) return;
  var held=null;
  G.objs.forEach(function(o){ if(o.held===slot) held=o; });

  if(m.t==="pick"){
    if(held) return;
    var best=null,bd=2.1;
    G.objs.forEach(function(o){
      if(o.held>=0) return;
      var d=Math.hypot(o.x-pl.x,o.z-pl.z);
      if(d<bd){ bd=d; best=o; }
    });
    if(best) best.held=slot;
    return;
  }
  if(m.t==="drop"){ hostDropHeld(slot,0,0,0); return; }
  if(m.t==="throw"){
    var ry=m.ry||pl.ry, sp=9.5;
    hostDropHeld(slot,Math.sin(ry)*sp,4.2,Math.cos(ry)*sp);
    return;
  }
  if(m.t==="mail"){
    if(!held||held.type!==OT_BOOK) return;
    var room=m.room;
    var target=G.players[room]; if(!target) return;
    var d=MAILBOX[room]?Math.hypot(MAILBOX[room].x-pl.x,MAILBOX[room].z-pl.z):99;
    if(d>2.4) return;
    var dat=held.data||{};
    target.recv.push({round:dat.round||G.round,from:dat.from,slot:(dat.round||G.round)-1,
                      strokes:dat.strokes||null});
    // 배달된 책은 사라진다
    for(var i=0;i<G.objs.length;i++) if(G.objs[i]===held){ G.objs.splice(i,1); break; }
    if(target.slot===0){ PRIV=privState(G.players[0]); }
    send(target,{t:"mailin"});
    pushAll();
    return;
  }
}

function pubState(){
  var d=G.draws[G.round]||{};
  return {phase:G.phase,round:G.round,theme:G.theme,themeOpts:G.themeOpts,
    themeTally:themeTally(),tEnd:G.tEnd,
    board:G.words.map(function(w){return [w.text,w.owner];}),
    result:G.result,
    peers:G.players.map(function(p){return p.peerId||"";}),
    players:G.players.map(function(p){
      return {name:p.name,slot:p.slot,online:p.online,iso:p.iso,dead:p.dead,
        isoNow:p.isoRound===G.round,
        done: G.phase==="theme"?(G.themeVotes[p.slot]!==undefined)
            : G.phase==="words"?!!(p.wa&&p.wb)
            : G.phase==="night"?(d[p.slot]!==undefined)
            : G.phase==="vote"?(G.votes[p.slot]!==undefined)
            : G.phase==="final"?!!p.answer : false};
    })};
}
function privState(p){
  var mis=null;
  if(G.phase==="night"&&G.miss.length&&RL.isActive(p,G.round)){
    var to=G.miss[G.round-1][p.slot];
    if(to!==undefined&&G.players[to]&&RL.isActive(G.players[to],G.round))
      mis={to:to,toName:G.players[to].name,wordIdx:G.locks[to][G.round-1]};
  }
  var d=G.draws[G.round]||{};
  return {me:p.slot,role:p.role,round:G.round,mission:mis,
    recv:p.recv.map(function(r){
      return {round:r.round,from:r.from,fromName:G.players[r.from]?G.players[r.from].name:"?",
              strokes:r.strokes};
    }),
    sent:d[p.slot]!==undefined, answer:p.answer};
}
function pushAll(){
  var pub=pubState();
  PUB=pub; PRIV=privState(G.players[0]);
  onState();
  G.players.forEach(function(p){ if(p.slot!==0) send(p,{t:"sync",pub:pub,priv:privState(p)}); });
}
function pushWorld(){
  var w={t:"w",p:G.players.map(function(p){
    return [p.slot,+p.x.toFixed(2),+p.z.toFixed(2),+p.ry.toFixed(2),
            +(p.y||0).toFixed(2),p.mode||0,p.pc||0,p.emote||0];
  }),o:(G.objs||[]).map(function(o){
    return [o.id,o.type,+o.x.toFixed(2),+o.y.toFixed(2),+o.z.toFixed(2),o.held,o.color];
  })};
  Object.keys(NET.conns).forEach(function(k){
    var c=NET.conns[k]; if(c&&c.open){ try{c.send(w);}catch(e){} }
  });
  WORLD=w.p; OBJS=w.o;
}
function themeTally(){
  var t={};
  Object.keys(G.themeVotes).forEach(function(k){ var v=G.themeVotes[k]; t[v]=(t[v]||0)+1; });
  return t;
}

/* ---- 참가자 ---- */
function clientOpen(){
  NET.mode="client"; showLobby();
  var peer=new Peer({debug:1}); NET.peer=peer;
  peer.on("open",function(id){
    NET.peerId=id;
    var c=peer.connect(pid(NET.code),{reliable:true});
    NET.conn=c;
    c.on("open",function(){ NET.connected=true; c.send({t:"join",name:NET.me,peerId:id}); });
    c.on("data",clientMsg);
    c.on("close",function(){ NET.connected=false; hudNet("연결 끊김 — 새로고침"); });
  });
  peer.on("error",function(e){ fail("방 번호가 맞는지, 방장이 방을 열어뒀는지 확인하세요. ("+(e.type||e)+")"); });
  try{ peer.on("call",onIncomingCall); }catch(e){}
}
function clientMsg(m){
  if(m.t==="deny"){ fail(m.why); return; }
  if(m.t==="hello"){ NET.slot=m.slot; NET.code=m.code; showLobby(); return; }
  if(m.t==="sync"){ PUB=m.pub; PRIV=m.priv; onState(); return; }
  if(m.t==="w"){ WORLD=m.p; OBJS=m.o||[]; return; }
  if(m.t==="mailin"){ flash(); return; }
  if(m.t==="hit"){ takeHit(m.from); return; }
}
function toHost(msg){
  if(NET.mode==="host"){ hostSelf(msg); return; }
  if(NET.conn&&NET.conn.open){ try{NET.conn.send(msg);}catch(e){} }
}
function hostSelf(m){
  var p=G.players[0];
  if(m.t==="hit"){
    var tp=G.players[m.target];
    hostDropHeld(m.target,(Math.random()-0.5)*2,3.2,(Math.random()-0.5)*2);
    if(tp&&tp.slot!==0) send(tp,{t:"hit",from:0});
    return;
  }
  if(m.t==="pick"||m.t==="throw"||m.t==="drop"||m.t==="mail"){ hostObjCmd(0,m); return; }
  if(m.t==="tvote"){ G.themeVotes[0]=m.i; pushAll(); }
  else if(m.t==="words"){ p.wa=m.a; p.wb=m.b; pushAll(); }
  else if(m.t==="draw"){
    if((G.draws[G.round]||{})[0]===undefined){
      (G.draws[G.round]=G.draws[G.round]||{})[0]=m.strokes||[];
      hostSpawnBook(0,G.miss[G.round-1][0],m.strokes||[],G.round);
    }
    pushAll();
  }
  else if(m.t==="vote"){ G.votes[0]=m.target; pushAll(); }
  else if(m.t==="answer"){ p.answer=m.arr; pushAll(); }
}

function showLobby(){
  $("stepName").classList.add("hidden");
  $("stepLobby").classList.remove("hidden");
  $("codeCard").classList.toggle("hidden",NET.mode!=="host");
  $("codeTxt").textContent=NET.code||"----";
  $("linkTxt").textContent=myLink();
  var list=(NET.mode==="host"&&G)?G.players:(PUB?PUB.players:[]);

function advance(){
  if(NET.mode!=="host") return;
  var ph=G.phase;

  if(ph==="lobby"){
    if(G.players.length<RL.MIN_PLAYERS){
      if(!confirm(RL.MIN_PLAYERS+"명 미만입니다. 그래도 시작할까요?")) return;
    }
    G.phase="theme"; G.tEnd=now()+RL.TIME.theme*1000; pushAll(); return;
  }
  if(ph==="theme"){
    var t=themeTally(),best=-1,bn=-1;
    Object.keys(t).forEach(function(k){ if(t[k]>bn){bn=t[k];best=+k;} });
    G.theme=G.themeOpts[best>=0?best:ri(G.themeOpts.length)];
    G.phase="words"; G.tEnd=now()+RL.TIME.words*1000; pushAll(); return;
  }
  if(ph==="words"){
    var subs=G.players.map(function(p){ return [p.wa,p.wb]; });
    var b=RL.buildBoard(subs);
    if(b.error){
      alert(b.error+"\n("+(G.players[b.who]?G.players[b.who].name:"?")+") 단어를 다시 받으세요.");
      G.tEnd=now()+30000; pushAll(); return;
    }
    G.words=b.words;
    var n=G.players.length;
    var roles=RL.assignRoles(n,rnd);
    G.players.forEach(function(p,i){ p.role=roles[i]; p.recv=[]; });
    G.locks=RL.buildLocks(n,G.words,rnd);
    G.miss=RL.buildAssignments(n,RL.ROUNDS,rnd);
    G.draws={}; G.round=1; G.phase="night"; G.tEnd=now()+RL.TIME.night*1000;
    hostObjInit();
    pushAll(); return;
  }
  if(ph==="night"){
    // 배달은 우편함으로만 이루어진다. 남은 스케치북은 사라진다.
    G.objs=(G.objs||[]).filter(function(o){ return o.type!==OT_BOOK; });
    G.phase="day"; G.tEnd=now()+RL.TIME.day*1000; pushAll(); return;
  }
  if(ph==="day"){
    G.votes={}; G.phase="vote"; G.tEnd=now()+RL.TIME.vote*1000; pushAll(); return;
  }
  if(ph==="vote"){
    var tal=RL.tally(G.votes);
    var res=RL.isolate(G.players,tal.target,G.round);
    G.lastVote={tally:tal,res:res};
    if(G.round>=RL.ROUNDS){ G.phase="final"; G.tEnd=now()+RL.TIME.final*1000; }
    else { G.round++; G.phase="night"; G.tEnd=now()+RL.TIME.night*1000; }
    pushAll(); return;
  }
  if(ph==="final"){
    G.result=RL.judge(G.players,G.locks,G.words);
    G.phase="result"; G.tEnd=0; pushAll(); return;
  }
  if(ph==="result"){ location.reload(); }
}
function now(){ return Date.now(); }

  if(now()>=G.tEnd) advance();
},500);

function checkDup(){
  var picks=[];
  for(var k=0;k<RL.SLOTS;k++) picks.push(+$("an"+k).value);
  var words=PUB.board.map(function(w){ return {text:w[0],owner:w[1]}; });
  var d=RL.duplicateOwner(picks,words);
  $("dupW").innerHTML=d
    ? '<span class="bad">'+(d.a+1)+'번과 '+(d.b+1)+'번이 둘 다 '+esc(PUB.players[d.owner].name)+' 단어입니다 — 하나는 가짜입니다.</span>'
    : '<span class="muted">같은 사람 단어가 둘 들어가면 여기에 경고가 뜹니다.</span>';
}

/* ============ 캔버스 ============ */
var padCtx=null,strokes=[];
function clearPad(){
  var cv=$("pad"); if(!cv||!padCtx) return;
  padCtx.fillStyle="#fff"; padCtx.fillRect(0,0,cv.width,cv.height);
  padCtx.strokeStyle="#111"; padCtx.fillStyle="#111";
}
function initPad(){
  var cv=$("pad"); if(!cv) return;
  padCtx=cv.getContext("2d");
  padCtx.lineWidth=10; padCtx.lineCap="round"; padCtx.lineJoin="round";
  strokes=[]; clearPad(); padReady=true;
  var drawing=false,cur=null,lx=0,ly=0;
  function pt(e){
    var r=cv.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};
  }
  cv.addEventListener("pointerdown",function(e){
    e.preventDefault(); e.stopPropagation(); cv.setPointerCapture(e.pointerId);
    var p=pt(e); drawing=true; lx=p.x; ly=p.y;
    cur=[Math.round(p.x/2),Math.round(p.y/2)]; strokes.push(cur);
    padCtx.beginPath(); padCtx.arc(p.x,p.y,5,0,7); padCtx.fill();
  });
  cv.addEventListener("pointermove",function(e){
    if(!drawing) return; e.preventDefault(); e.stopPropagation();
    var p=pt(e);
    if(Math.abs(p.x-lx)<3&&Math.abs(p.y-ly)<3) return;
    padCtx.beginPath(); padCtx.moveTo(lx,ly); padCtx.lineTo(p.x,p.y); padCtx.stroke();
    lx=p.x; ly=p.y; cur.push(Math.round(p.x/2),Math.round(p.y/2));
  });
  function up(){ drawing=false; cur=null; }
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
}
function drawStrokes(cv,st){
  var c=cv.getContext("2d");
  c.fillStyle="#fff"; c.fillRect(0,0,cv.width,cv.height);
  if(!st||!st.length){
    c.fillStyle="#c8ccd2"; c.font="14px system-ui,sans-serif"; c.textAlign="center";
    c.fillText("(그림 없음)",cv.width/2,cv.height/2); return;
  }
  var sc=cv.width/256;
  c.strokeStyle="#111"; c.fillStyle="#111";
  c.lineWidth=Math.max(2,5*sc); c.lineCap="round"; c.lineJoin="round";
  st.forEach(function(s){
    if(s.length<2) return;
    c.beginPath(); c.moveTo(s[0]*sc,s[1]*sc);
    if(s.length===2){ c.arc(s[0]*sc,s[1]*sc,c.lineWidth/2,0,7); c.fill(); return; }
    for(var i=2;i<s.length;i+=2) c.lineTo(s[i]*sc,s[i+1]*sc);
    c.stroke();
  });
}

/* ============ 음성 ============ */
var VOICE={on:false,stream:null,calls:{},audios:{}};
$("btnMic").onclick=function(){ VOICE.on?voiceOff():voiceOn(); };
function voiceOn(){
  if(!navigator.mediaDevices){ alert("이 브라우저에서는 음성을 쓸 수 없습니다."); return; }
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){
    VOICE.stream=s; VOICE.on=true;
    $("btnMic").textContent="마이크 켬"; $("btnMic").className="on";
    connectVoice(); updateVoice();
  }).catch(function(){ alert("마이크 권한이 필요합니다."); });
}
function voiceOff(){
  VOICE.on=false;
  try{ if(VOICE.stream) VOICE.stream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
  VOICE.stream=null;
  Object.keys(VOICE.calls).forEach(function(k){ try{VOICE.calls[k].close();}catch(e){} });
  VOICE.calls={};
  Object.keys(VOICE.audios).forEach(function(k){ try{VOICE.audios[k].pause();}catch(e){} });
  VOICE.audios={};
  $("btnMic").textContent="마이크 끔"; $("btnMic").className="";
}
function connectVoice(){
  if(!VOICE.on||!PUB||!PUB.peers||!NET.peer) return;
  PUB.peers.forEach(function(pidStr){
    if(!pidStr||pidStr===NET.peerId||VOICE.calls[pidStr]) return;
    if(NET.peerId>pidStr) return;   // 쌍마다 한 번만
    try{
      var call=NET.peer.call(pidStr,VOICE.stream);
      hookCall(pidStr,call);
    }catch(e){}
  });
}
function onIncomingCall(call){
  try{
    if(!VOICE.stream){ call.answer(); } else { call.answer(VOICE.stream); }
    hookCall(call.peer,call);
  }catch(e){}
}
function hookCall(key,call){
  if(!call) return;
  VOICE.calls[key]=call;
  call.on("stream",function(rs){
    var a=VOICE.audios[key];
    if(!a){ a=VOICE.audios[key]=new Audio(); a.autoplay=true; }
    a.srcObject=rs;
    a.play().catch(function(){});
    updateVoice();
  });
  call.on("close",function(){ delete VOICE.calls[key]; delete VOICE.audios[key]; });
  call.on("error",function(){ delete VOICE.calls[key]; });
}
function updateVoice(){
  if(!PUB) return;
  if(VOICE.on) connectVoice();
  var ph=PUB.phase;
  var talkPhase=(ph==="lobby"||ph==="theme"||ph==="day"||ph==="vote"||ph==="result");
  var mine=PUB.players[mySlot()];
  var canTalk=talkPhase&&mine&&!mine.dead&&!mine.isoNow;
  try{
    if(VOICE.stream) VOICE.stream.getAudioTracks().forEach(function(t){ t.enabled=!!canTalk; });
  }catch(e){}
  var hear=talkPhase;
  Object.keys(VOICE.audios).forEach(function(k){
    try{ VOICE.audios[k].volume=hear?1:0; }catch(e){}
  });
  if(VOICE.on) $("btnMic").textContent=canTalk?"마이크 켬":"음소거됨";
}

/* ============ 루프 ============ */
var lastSend=0;
function tick(){
  requestAnimationFrame(tick);
  var dt=Math.min(0.05,clock.getDelta());
  if(started){
    stepMe(dt);
    if(meMesh){
      meMesh.group.position.set(me.x,me.y,me.z);
      meMesh.group.rotation.y=me.ry;
      meMesh.mode=me.mode; meMesh.air=me.ground?0:1;
      meMesh.punch=me.punch; meMesh.ty=me.y;
      meMesh.emote=me.emote; meMesh.land=me.land;
      poseAvatar(meMesh,dt);
    }
    updateCamera(dt);
    lastSend+=dt;
    if(lastSend>0.08){
      lastSend=0;
      if(NET.mode==="client"){
        if(NET.conn&&NET.conn.open){ try{NET.conn.send({t:"pos",
          x:+me.x.toFixed(2),z:+me.z.toFixed(2),ry:+me.ry.toFixed(2),
          y:+me.y.toFixed(2),m:me.mode,pc:me.pc,em:me.emote});}catch(e){} }
      } else if(G){
        var h0=G.players[0];
        h0.x=me.x; h0.z=me.z; h0.ry=me.ry; h0.y=me.y; h0.mode=me.mode; h0.pc=me.pc;
        h0.emote=me.emote;
        pushWorld();
      }
    }
    if(NET.mode==="host"&&G&&G.objs){ hostObjStep(dt); }
    syncAvatars(dt);
    syncObjects(dt);
    if(PUB) renderHUD();
  }
  renderer.render(scene,camera);
}
function syncObjects(dt){
  var seen={};
  OBJS.forEach(function(o){
    var id=o[0]; seen[id]=1;
    var m=objMesh[id];
    if(!m){ m=objMesh[id]=makeObjMesh(o[1],o[6]); }
    var tx=o[2],ty=o[3],tz=o[4];
    if(o[5]===mySlot()){
      var h=handPos(); tx=h.x; ty=h.y; tz=h.z;
      m.rotation.y=me.ry;
    } else if(o[5]>=0){
      var a=avatars[o[5]];
      if(a){ tx=a.group.position.x+Math.sin(a.group.rotation.y)*HAND_F;
             tz=a.group.position.z+Math.cos(a.group.rotation.y)*HAND_F;
             ty=a.group.position.y+HAND_H; m.rotation.y=a.group.rotation.y; }
    } else {
      m.rotation.y+=dt*0.6;
    }
    m.position.x+=(tx-m.position.x)*Math.min(1,dt*18);
    m.position.y+=(ty-m.position.y)*Math.min(1,dt*18);
    m.position.z+=(tz-m.position.z)*Math.min(1,dt*18);
  });
  Object.keys(objMesh).forEach(function(k){
    if(!seen[k]){ scene.remove(objMesh[k]); delete objMesh[k]; }
  });
}

function syncAvatars(dt){
  if(!PUB) return;
  var seen={};
  WORLD.forEach(function(w){
    var slot=w[0]; if(slot===mySlot()) return;
    var p=PUB.players[slot]; if(!p) return;
    seen[slot]=1;
    var a=avatars[slot];
    if(!a){ a=avatars[slot]=makeAvatar(p.name,slot); a.group.position.set(w[1],0,w[2]); }
    a.tx=w[1]; a.tz=w[2]; a.tr=w[3];
    a.ty=w[4]||0; a.mode=w[5]||0; a.air=((w[4]||0)>0.05)?1:0; a.emote=w[7]||0;
    var npc=w[6]||0;
    if(npc!==a.pc){ a.pc=npc; a.punch=1; }
    a.group.visible=p.online!==false;
    if(a.mat){ a.mat.opacity=p.dead?0.3:1; a.mat.transparent=!!p.dead; }
  });
  Object.keys(avatars).forEach(function(k){
    if(!seen[k]){ scene.remove(avatars[k].group); delete avatars[k]; return; }
    var a=avatars[k],g=a.group;
    g.position.x+=(a.tx-g.position.x)*Math.min(1,dt*12);
    g.position.z+=(a.tz-g.position.z)*Math.min(1,dt*12);
    var d=a.tr-g.rotation.y;
    while(d>PI) d-=PI*2; while(d<-PI) d+=PI*2;
    g.rotation.y+=d*Math.min(1,dt*12);
    poseAvatar(a,dt);
  });
}
/* mode: 0 정지 1 걷기 2 달리기 / air: 공중 / punch: 1 에서 0 으로 */
function lerpRot(j,axis,target,dt,rate){
  j.rotation[axis]+=(target-j.rotation[axis])*Math.min(1,dt*(rate||12));
}
function poseSkinned(a,dt){
  a.t=(a.t||0)+dt;

  // 정지 → 걷기 → 달리기 사이를 이어서 섞는다
  var target=a.mode===0?0:(a.mode===1?0.5:1);
  a.blend+=(target-a.blend)*Math.min(1,dt*6);
  var b=a.blend;
  var wIdle=b<0.5?(1-b*2):0;
  var wWalk=b<0.5?(b*2):(2-b*2);
  var wRun =b<0.5?0:(b*2-1);
  if(a.act.idle) a.act.idle.setEffectiveWeight(wIdle);
  if(a.act.walk){ a.act.walk.setEffectiveWeight(wWalk); a.act.walk.setEffectiveTimeScale(1.0); }
  if(a.act.run){ a.act.run.setEffectiveWeight(wRun); a.act.run.setEffectiveTimeScale(1.0); }

  a.mixer.update(dt);

  var B=a.B, ax=rightAxis(a);

  // 공중
  if(a.air>0){
    worldSpin(B.legL,ax,SGN.leg*0.7);  worldSpin(B.legR,ax,SGN.leg*0.3);
    worldSpin(B.kneeL,ax,SGN.knee*1.1); worldSpin(B.kneeR,ax,SGN.knee*0.5);
    worldSpin(B.armL,ax,SGN.arm*1.9);  worldSpin(B.armR,ax,SGN.arm*1.9);
  }

  // 감정표현
  if(a.emote===1){                       // 앉기
    worldSpin(B.legL,ax,SGN.leg*1.5); worldSpin(B.legR,ax,SGN.leg*1.5);
    worldSpin(B.kneeL,ax,SGN.knee*1.5); worldSpin(B.kneeR,ax,SGN.knee*1.5);
    a.group.position.y=(a.ty||0)-0.34;
  } else if(a.emote===2){                // 손 흔들기
    worldSpin(B.armR,ax,SGN.arm*2.4);
    worldSpin(B.foreR,_axU,Math.sin(a.t*11)*0.6);
    a.group.position.y=a.ty||0;
  } else if(a.emote===3){                // 춤
    var d1=a.t*7;
    worldSpin(B.hips,_axU,Math.sin(d1)*0.5);
    worldSpin(B.armL,ax,SGN.arm*(1.7+Math.sin(d1)*0.6));
    worldSpin(B.armR,ax,SGN.arm*(1.7-Math.sin(d1)*0.6));
    a.group.position.y=(a.ty||0)+Math.abs(Math.sin(d1*2))*0.12;
  } else {
    a.group.position.y=a.ty||0;
  }

  // 펀치
  if(a.punch>0){
    a.punch=Math.max(0,a.punch-dt/0.32);
    var k=1-a.punch, ext=Math.sin(Math.min(1,k*1.8)*PI);
    worldSpin(B.armR,ax,SGN.arm*1.6*ext);
    worldSpin(B.foreR,ax,SGN.arm*0.5*ext);
    worldSpin(B.hips,_axU,SGN.twist*-0.35*ext);
  }
}

function poseAvatar(a,dt){
  if(a.skinned) return poseSkinned(a,dt);
  var moving=a.mode>0, run=a.mode===2;
  a.phase=(a.phase||0)+(moving?dt*(run?15:9.5):0);
  a.t=(a.t||0)+dt;
  var p=a.phase, amp=run?0.95:0.55, arm=run?0.85:0.42;

  // 감정표현
  if(a.emote===1){                       // 앉기
    lerpRot(a.legL,"x",-1.55,dt,9); lerpRot(a.legR,"x",-1.55,dt,9);
    lerpRot(a.kneL,"x", 1.55,dt,9); lerpRot(a.kneR,"x", 1.55,dt,9);
    lerpRot(a.armL,"x", 0.25,dt,9); lerpRot(a.armR,"x", 0.25,dt,9);
    lerpRot(a.elbL,"x", 0.35,dt,9); lerpRot(a.elbR,"x", 0.35,dt,9);
    a.hip.position.y+=((HIP_Y-0.30)-a.hip.position.y)*Math.min(1,dt*9);
    lerpRot(a.torso,"x",0.12,dt,9);
    a.group.position.y=a.ty||0;
    return;
  }
  if(a.emote===2){                       // 손 흔들기
    var w=Math.sin(a.t*11);
    lerpRot(a.armR,"x",-2.5,dt,12);
    a.elbR.rotation.z=w*0.55; a.elbR.rotation.x=0.3;
    lerpRot(a.armL,"x",0.1,dt,10); lerpRot(a.elbL,"x",0.2,dt,10);
    lerpRot(a.legL,"x",0,dt,10); lerpRot(a.legR,"x",0,dt,10);
    lerpRot(a.kneL,"x",0,dt,10); lerpRot(a.kneR,"x",0,dt,10);
    a.hip.position.y+=(HIP_Y-a.hip.position.y)*Math.min(1,dt*10);
    a.group.position.y=a.ty||0;
    return;
  }
  if(a.emote===3){                       // 춤
    var d1=a.t*7;
    a.hip.rotation.y=Math.sin(d1)*0.5;
    a.hip.position.y=HIP_Y+Math.abs(Math.sin(d1*2))*0.13;
    a.armL.rotation.x=-1.9+Math.sin(d1)*0.7; a.armR.rotation.x=-1.9-Math.sin(d1)*0.7;
    a.elbL.rotation.x=0.7; a.elbR.rotation.x=0.7;
    a.legL.rotation.x=Math.sin(d1)*0.35; a.legR.rotation.x=-Math.sin(d1)*0.35;
    a.kneL.rotation.x=0.25; a.kneR.rotation.x=0.25;
    a.torso.rotation.z=Math.sin(d1)*0.12;
    a.group.position.y=a.ty||0;
    return;
  }
  a.torso.rotation.z+=(0-a.torso.rotation.z)*Math.min(1,dt*10);
  a.elbR.rotation.z+=(0-a.elbR.rotation.z)*Math.min(1,dt*10);

  if(a.air>0){
    a.legL.rotation.x=-0.55; a.legR.rotation.x=0.25;
    a.kneL.rotation.x=1.0;   a.kneR.rotation.x=0.35;
    a.armL.rotation.x=-2.2;  a.armR.rotation.x=-2.2;
    a.elbL.rotation.x=0.5;   a.elbR.rotation.x=0.5;
    a.hip.position.y=HIP_Y;
    a.torso.rotation.x=-0.12;
  } else {
    // 걷기/달리기 사이도, 정지와 이동 사이도 부드럽게 섞는다
    var blend=Math.min(1,(a.mode===0?0:(a.mode===1?0.62:1)));
    a.blend=(a.blend===undefined?blend:a.blend+(blend-a.blend)*Math.min(1,dt*7));
    var bl=a.blend;
    var sw=Math.sin(p), sw2=Math.sin(p+0.7);
    var breathe=Math.sin(a.t*1.9)*0.02*(1-bl);

    lerpRot(a.legL,"x", sw*amp*bl,dt,18);
    lerpRot(a.legR,"x",-sw*amp*bl,dt,18);
    lerpRot(a.kneL,"x",Math.max(0,-sw2)*(run?1.25:0.85)*bl,dt,18);
    lerpRot(a.kneR,"x",Math.max(0, sw2)*(run?1.25:0.85)*bl,dt,18);
    lerpRot(a.armL,"x",-sw*arm*bl+breathe,dt,14);
    lerpRot(a.armR,"x", sw*arm*bl+breathe,dt,14);
    lerpRot(a.elbL,"x",0.18+Math.max(0, sw)*0.35*bl,dt,14);
    lerpRot(a.elbR,"x",0.18+Math.max(0,-sw)*0.35*bl,dt,14);

    var dip=(a.land||0)*0.22;
    var bob=Math.abs(sw)*(run?0.075:0.045)*bl;
    a.hip.position.y+=((HIP_Y+bob-dip)-a.hip.position.y)*Math.min(1,dt*16);
    lerpRot(a.torso,"x",(run?-0.22:-0.06*bl)+dip*0.6+breathe,dt,10);
    if(a.land>0) a.land=Math.max(0,a.land-dt*3.4);
  }

  if(a.punch>0){
    a.punch=Math.max(0,a.punch-dt/0.32);
    var k=1-a.punch;
    var ext=Math.sin(Math.min(1,k*1.8)*PI);
    a.armR.rotation.x=-1.55*ext-0.15;
    a.elbR.rotation.x=(1-ext)*1.5;
    a.hip.rotation.y=-0.35*ext;
    a.armL.rotation.x=0.5*ext;
  } else {
    a.hip.rotation.y+=(0-a.hip.rotation.y)*Math.min(1,dt*10);
  }
  a.group.position.y=a.ty||0;
}
function hudNet(s){ $("sub").textContent=s; }

initScene();
loadCharacter();
tick();
