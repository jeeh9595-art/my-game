<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>8호실 · 내 카드</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#0f1216;color:#e3e9ed;
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       font-size:15px;line-height:1.8;-webkit-text-size-adjust:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 70px;}

  .veil{position:fixed;inset:0;background:#0f1216;z-index:50;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:18px;text-align:center;padding:30px;}
  .veil p{color:#7d8894;font-size:14px;margin:0;max-width:330px;line-height:1.9;}

  .badge{font-size:11px;letter-spacing:2px;border-radius:20px;padding:4px 12px;
         border:1px solid #1d4a46;background:#12302e;color:#45c2b7;display:inline-block;}
  .badge.tr{border-color:#5a2a26;background:#35201e;color:#e8695e;}

  h1{font-size:22px;margin:10px 0 2px;letter-spacing:1px;}
  .sub{color:#7d8894;font-size:13px;margin-bottom:16px;}

  .card{background:#161b21;border:1px solid #232b33;border-radius:12px;padding:15px 16px;margin-bottom:12px;}
  .card h2{margin:0 0 10px;font-size:11.5px;letter-spacing:2px;color:#7d8894;text-transform:uppercase;font-weight:500;}

  .warn{background:#35201e;border-left:3px solid #e8695e;border-radius:0 8px 8px 0;
        padding:11px 14px;font-size:13.5px;color:#f0c9c5;margin-bottom:14px;}
  .warn b{color:#e8695e;}
  .tip{background:#1b2128;border-left:3px solid #45c2b7;border-radius:0 8px 8px 0;
       padding:11px 14px;font-size:13px;color:#c3ccd5;margin-bottom:12px;}
  .tip b{color:#45c2b7;}

  .words{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px;}
  .w{background:#11161b;border:1px solid #2a323b;border-radius:8px;padding:8px 9px;}
  .w .t{font-size:14.5px;font-weight:600;}
  .w .o{font-size:10.5px;color:#6f7a86;margin-top:1px;}
  .w.mine{border-color:#3a4a5a;}
  .w.mine .o{color:#8fa3b8;}

  .rd{border:1px solid #232b33;border-radius:11px;margin-bottom:10px;overflow:hidden;background:#161b21;}
  .rdh{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;}
  .rdh .n{font-size:11px;letter-spacing:2px;color:#7d8894;}
  .rdh .ttl{flex:1;font-size:14.5px;}
  .rdh .arw{color:#5f6a76;font-size:13px;}
  .rdb{padding:0 15px 15px;display:none;}
  .rd.open .rdb{display:block;}
  .rd.open{border-color:#2f3a45;}

  .mission{background:#11161b;border:1px solid #2a323b;border-radius:9px;padding:12px 14px;margin-bottom:12px;}
  .mission .to{font-size:13px;color:#8b95a0;}
  .mission .wd{font-size:27px;font-weight:700;letter-spacing:2px;color:#ffd75e;line-height:1.35;}

  canvas{display:block;width:100%;max-width:420px;aspect-ratio:1/1;background:#fff;
         border-radius:10px;touch-action:none;cursor:crosshair;margin:0 auto;}
  .tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  button{font:inherit;font-size:14px;border:none;border-radius:8px;padding:9px 16px;
         background:#4c7dfc;color:#fff;cursor:pointer;}
  button:hover{background:#3f6ce0;}
  button.ghost{background:#2c343d;}
  button.ghost:hover{background:#374049;}
  button:disabled{background:#242b33;color:#5b646d;cursor:default;}
  .clock{font-size:19px;font-variant-numeric:tabular-nums;color:#45c2b7;min-width:44px;text-align:center;}
  .clock.warn{color:#e8695e;}

  .out{margin-top:12px;text-align:center;}
  .out img{max-width:100%;border-radius:10px;border:1px solid #2a323b;}
  .out .hint{font-size:12.5px;color:#7d8894;margin-top:8px;line-height:1.8;}

  select{font:inherit;background:#11161b;color:#e3e9ed;border:1px solid #2a323b;
         border-radius:8px;padding:8px 9px;width:100%;}
  .guess{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin-bottom:8px;}
  .guess .lb{font-size:12.5px;color:#7d8894;}
  .muted{color:#7d8894;font-size:12.5px;}
  .err{color:#e8695e;}
  label.ck{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;margin:2px 0 8px;}
</style>
</head>
<body>

<div class="veil" id="veil">
  <div class="badge">8 호 실</div>
  <p>이 화면에는 <b style="color:#e3e9ed">당신만 알아야 하는 정보</b>가 들어 있습니다.<br>주변을 확인하고 여세요.</p>
  <button id="open">내 카드 열기</button>
</div>

<div class="wrap" id="app">불러오는 중…</div>

<script>
"use strict";
function el(id){return document.getElementById(id);}

/* ---------- 데이터 해독 ---------- */
function decode(h){
  try{ return JSON.parse(decodeURIComponent(escape(atob(h)))); }catch(e){ return null; }
}
var D = decode(location.hash.replace(/^#/,""));

el("open").onclick=function(){ el("veil").style.display="none"; };

if(!D){
  el("app").innerHTML='<div class="card"><h2>오류</h2><div class="err">'+
    '카드를 불러오지 못했습니다. 방장에게 링크를 다시 받아주세요.</div></div>';
} else {
  render();
}

function render(){
  var me = D.n[D.me];
  var isTr = D.r === "t";
  var h = "";

  h += '<div class="badge'+(isTr?" tr":"")+'">'+(isTr?"배 신 자":"참 가 자")+'</div>';
  h += '<h1>'+me+'</h1>';
  h += '<div class="sub">주제 · <b style="color:#e3e9ed">'+D.t+'</b></div>';

  h += '<div class="warn"><b>절대 남에게 보여주지 마세요.</b> 화면을 공유하거나 캡처해서 단톡방에 올리면 그 판은 끝입니다.</div>';

  if(isTr){
    h += '<div class="card"><h2>당신의 임무</h2>'+
      '<p style="margin:0 0 8px;">당신은 <b style="color:#e8695e">배신자</b>입니다. 탈출하지 못하는 사람을 늘리는 것이 목표입니다.</p>'+
      '<p style="margin:0 0 8px;">방법은 하나 — <b>일부러 다른 단어를 그려서 보내세요.</b> '+
      '아래 라운드 화면에서 「다른 단어 그리기」를 켜면 원하는 단어를 고를 수 있습니다.</p>'+
      '<p style="margin:0;" class="muted">들켜도 빠져나갈 구멍이 있습니다. "나는 제대로 그렸는데 네가 잘못 본 거야." '+
      '주제가 같아서 다들 비슷하게 생겼으니, 못 그린 척하는 게 최고의 알리바이입니다.</p></div>';
  } else {
    h += '<div class="tip"><b>할 일</b> — 매 라운드 정해진 사람에게 단어를 그려서 보냅니다. '+
      '그리고 내가 받은 그림 넷을 보고 내 자물쇠 단어 넷을 알아맞혀야 합니다.</div>';
  }

  /* 단어판 */
  h += '<div class="card"><h2>단어판 · 이 안에 모든 정답이 있습니다</h2><div class="words">';
  D.w.forEach(function(w){
    var mine = w[1] === D.me;
    h += '<div class="w'+(mine?" mine":"")+'"><div class="t">'+esc(w[0])+'</div>'+
         '<div class="o">'+esc(D.n[w[1]])+(mine?" (나)":"")+'</div></div>';
  });
  h += '</div><div class="muted" style="margin-top:10px;">'+
       '한 사람의 자물쇠에는 <b>같은 사람이 낸 단어가 두 개 들어가지 않습니다.</b> '+
       '내가 받은 그림 넷 중 둘이 같은 사람 단어로 보이면, 하나는 가짜입니다.</div></div>';

  /* 라운드 */
  h += '<div class="card"><h2>내가 그려야 할 것</h2>'+
       '<div class="muted" style="margin-bottom:12px;">라운드를 눌러 펼치세요. 그린 그림은 <b>받는 사람에게 직접</b> 카톡으로 보내면 됩니다.</div>';
  D.m.forEach(function(m,i){
    h += '<div class="rd" id="rd'+i+'">'+
      '<div class="rdh" data-i="'+i+'"><span class="n">R'+(i+1)+'</span>'+
      '<span class="ttl">'+esc(D.n[m[0]])+' 에게 보내기</span><span class="arw">열기 ▾</span></div>'+
      '<div class="rdb">'+
        '<div class="mission"><div class="to">받는 사람 · <b style="color:#e3e9ed">'+esc(D.n[m[0]])+'</b></div>'+
        '<div class="wd" id="wd'+i+'">'+esc(D.w[m[1]][0])+'</div></div>';
    if(isTr){
      h += '<label class="ck"><input type="checkbox" id="fk'+i+'"> 다른 단어 그리기 (위조)</label>'+
           '<select id="fs'+i+'" style="display:none;margin-bottom:10px;">'+
           D.w.map(function(w,wi){return '<option value="'+wi+'">'+esc(w[0])+'</option>';}).join("")+
           '</select>';
    }
    h += '<canvas id="cv'+i+'" width="640" height="640"></canvas>'+
      '<div class="tools">'+
        '<button class="ghost" id="cl'+i+'">전체 지우기</button>'+
        '<button class="ghost" id="tm'+i+'">20초 타이머</button>'+
        '<span class="clock" id="ck'+i+'">–</span>'+
        '<button id="mk'+i+'">보낼 그림 만들기</button>'+
      '</div>'+
      '<div class="out" id="ot'+i+'"></div>'+
      '</div></div>';
  });
  h += '</div>';

  /* 내 추측 */
  h += '<div class="card"><h2>내 자물쇠 · 받은 그림을 보고 추측</h2>'+
       '<div class="muted" style="margin-bottom:12px;">여기 적어두면 이 기기에 저장됩니다. 마지막에 방장에게 이 넷을 말하면 됩니다.</div>';
  for(var k=0;k<D.s;k++){
    h += '<div class="guess"><span class="lb">'+(k+1)+'번 칸</span>'+
      '<select id="g'+k+'"><option value="-1">모름</option>'+
      D.w.map(function(w,wi){return '<option value="'+wi+'">'+esc(w[0])+' <'+esc(D.n[w[1]])+'></option>';}).join("")+
      '</select></div>';
  }
  h += '<div class="muted" id="dupWarn" style="margin-top:8px;"></div></div>';

  el("app").innerHTML = h;
  wire();
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------- 동작 ---------- */
function wire(){
  var heads = document.querySelectorAll(".rdh");
  for(var i=0;i<heads.length;i++){
    heads[i].onclick = function(){
      var i = this.getAttribute("data-i");
      var box = el("rd"+i);
      box.classList.toggle("open");
      this.querySelector(".arw").textContent = box.classList.contains("open") ? "접기 ▴" : "열기 ▾";
      if(box.classList.contains("open")) initCanvas(+i);
    };
  }

  D.m.forEach(function(m,i){
    if(el("fk"+i)){
      el("fk"+i).onchange = function(){
        var on = this.checked;
        el("fs"+i).style.display = on ? "block" : "none";
        el("wd"+i).textContent = on ? D.w[+el("fs"+i).value][0] : D.w[m[1]][0];
        el("wd"+i).style.color = on ? "#e8695e" : "#ffd75e";
      };
      el("fs"+i).onchange = function(){
        el("wd"+i).textContent = D.w[+this.value][0];
      };
    }
  });

  for(var k=0;k<D.s;k++){
    (function(k){
      var s = el("g"+k);
      var saved = load("g"+D.me+"_"+k);
      if(saved !== null) s.value = saved;
      s.onchange = function(){ save("g"+D.me+"_"+k, this.value); checkDup(); };
    })(k);
  }
  checkDup();
}

function checkDup(){
  var owners = {}, dup = null;
  for(var k=0;k<D.s;k++){
    var v = +el("g"+k).value;
    if(v < 0) continue;
    var o = D.w[v][1];
    if(owners[o] !== undefined) dup = {a:owners[o], b:k, who:D.n[o]};
    owners[o] = k;
  }
  el("dupWarn").innerHTML = dup
    ? '<span class="err">'+(dup.a+1)+'번과 '+(dup.b+1)+'번이 둘 다 '+esc(dup.who)+
      ' 이(가) 낸 단어입니다 — 둘 중 하나는 가짜입니다.</span>'
    : '<span class="muted">같은 사람이 낸 단어가 둘 들어가면 여기에 경고가 뜹니다.</span>';
}

function save(k,v){ try{ localStorage.setItem("room8_"+k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem("room8_"+k); }catch(e){ return null; } }

/* ---------- 캔버스 ---------- */
var inited = {};
function initCanvas(i){
  if(inited[i]) return;
  inited[i] = true;
  var cv = el("cv"+i), ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle = "#111111"; ctx.lineWidth = 11;
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  var drawing = false, lx = 0, ly = 0, locked = false;
  function pt(e){
    var r = cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) };
  }
  cv.addEventListener("pointerdown", function(e){
    if(locked) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    var p = pt(e); drawing = true; lx = p.x; ly = p.y;
    ctx.beginPath(); ctx.arc(p.x,p.y,ctx.lineWidth/2,0,7); ctx.fillStyle="#111"; ctx.fill();
  });
  cv.addEventListener("pointermove", function(e){
    if(!drawing||locked) return;
    e.preventDefault();
    var p = pt(e);
    ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke();
    lx = p.x; ly = p.y;
  });
  function up(){ drawing = false; }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);

  el("cl"+i).onclick = function(){
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = "#111";
    el("ot"+i).innerHTML = "";
  };

  el("tm"+i).onclick = function(){
    var left = 20, ck = el("ck"+i);
    locked = false;
    ck.textContent = left; ck.className = "clock";
    this.disabled = true;
    var t = setInterval(function(){
      left--;
      ck.textContent = Math.max(0,left);
      if(left <= 5) ck.className = "clock warn";
      if(left <= 0){
        clearInterval(t); locked = true;
        ck.textContent = "끝";
        el("mk"+i).click();
      }
    }, 1000);
  };

  el("mk"+i).onclick = function(){
    var url = cv.toDataURL("image/png");
    el("ot"+i).innerHTML =
      '<img src="'+url+'" alt="그린 그림">'+
      '<div class="hint">이 그림을 <b>'+esc(D.n[D.m[i][0]])+'</b> 에게 카톡으로 보내세요.<br>'+
      '폰이면 그림을 <b>길게 눌러 저장</b>, 컴퓨터면 <b>우클릭 → 이미지 복사</b>.<br>'+
      '<a id="dl'+i+'" href="'+url+'" download="room8_R'+(i+1)+'.png" '+
      'style="color:#45c2b7;">파일로 저장</a></div>';
  };
}
</script>
</body>
</html>
