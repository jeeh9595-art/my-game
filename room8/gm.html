<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8호실 · 진행자 화면</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#12141a;color:#e6e8ec;
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:14px;line-height:1.8;}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 90px;}
  h1{font-size:20px;letter-spacing:3px;margin:0 0 4px;}
  .tag{font-size:12px;color:#7f8794;margin-bottom:20px;}
  h2{font-size:14.5px;margin:26px 0 10px;color:#cdd3dc;letter-spacing:1px;
     border-left:3px solid #4c7dfc;padding-left:9px;}
  .box{background:#1a1d25;border:1px solid #262b36;border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  label{font-size:12px;color:#98a0ac;display:block;margin-bottom:5px;}
  input[type=text],select,textarea{font:inherit;background:#0f1116;color:#e6e8ec;
    border:1px solid #303743;border-radius:7px;padding:8px 10px;width:100%;}
  textarea{min-height:110px;resize:vertical;line-height:1.7;}
  button{font:inherit;border:none;border-radius:8px;padding:9px 18px;background:#4c7dfc;color:#fff;cursor:pointer;}
  button:hover{background:#3f6ce0;}
  button.ghost{background:#333a47;} button.ghost:hover{background:#3d4552;}
  button.sm{padding:5px 12px;font-size:12.5px;}
  button.on{background:#45c2b7;color:#08201e;}
  button:disabled{background:#242b33;color:#5b646d;cursor:default;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .row>div{flex:1;min-width:130px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
  .pcard{background:#1a1d25;border:1px solid #262b36;border-radius:11px;padding:13px 14px;}
  .pname{font-weight:bold;font-size:15px;margin-bottom:8px;}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
        background:#2a303c;color:#aeb6c2;margin-right:4px;}
  .chip.tr{background:#5a2b2b;color:#ffb3b3;}
  .chip.iso{background:#4a3f18;color:#ffd98a;}
  .chip.dead{background:#3a2320;color:#ff9a90;}
  .note{background:#171c28;border-left:3px solid #ffd75e;border-radius:0 8px 8px 0;
        padding:12px 15px;font-size:13.5px;color:#d3d9e2;margin-bottom:14px;line-height:1.9;}
  .note b{color:#ffd75e;}
  .note.sig{border-left-color:#45c2b7;} .note.sig b{color:#45c2b7;}
  .note.bad{border-left-color:#e8695e;} .note.bad b{color:#e8695e;}
  .turnbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#1a1d25;
           border:1px solid #262b36;border-radius:12px;padding:13px 18px;margin-bottom:16px;}
  .turnbar .big{font-size:19px;font-weight:bold;letter-spacing:2px;}
  .phase{font-size:12px;padding:4px 12px;border-radius:20px;background:#22305a;color:#a9c2ff;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid #262b36;text-align:left;vertical-align:top;}
  th{color:#8b93a0;font-weight:normal;font-size:11.5px;background:#1f242c;}
  tbody tr:last-child td{border-bottom:0;}
  .tw{overflow-x:auto;border:1px solid #262b36;border-radius:10px;}
  .ok{color:#6ee7a0;} .bad{color:#ff7b7b;}
  .muted{color:#7f8794;font-size:12.5px;line-height:1.8;}
  .copied{color:#6ee7a0;font-size:11px;margin-left:6px;}
  .hidden{display:none!important;}
  .wchips{display:flex;flex-wrap:wrap;gap:6px;}
  .wchip{background:#0f1116;border:1px solid #2b3240;border-radius:7px;padding:5px 10px;font-size:13px;}
  .wchip small{color:#6f7a86;margin-left:5px;}
  .themebtns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">

<h1>8호실 · 진행자 화면</h1>
<div class="tag">그림 전달 버전 · 방장 한 명만 이 화면을 봅니다</div>

<!-- ============ 1. 설정 ============ -->
<div id="s1">
  <h2>1. 인원과 주제</h2>
  <div class="box">
    <div class="row" style="margin-bottom:14px;">
      <div style="max-width:130px;">
        <label>인원</label>
        <select id="cnt"><option>5</option><option>6</option><option selected>7</option><option>8</option></select>
      </div>
      <div style="max-width:200px;">
        <label>배신자</label>
        <select id="ntr"><option value="auto" selected>자동 (5~6명 1 · 7~8명 2)</option><option value="1">1명</option><option value="2">2명</option></select>
      </div>
    </div>

    <label>주제 — 그림으로 헷갈리는 것이어야 합니다</label>
    <div class="themebtns" id="themes"></div>
    <input type="text" id="theme" placeholder="직접 입력도 가능">

    <label style="margin-top:14px;">플레이어 이름 (한 줄에 한 명)</label>
    <textarea id="names"></textarea>

    <div style="margin-top:14px;"><button id="toWords">다음 · 단어 받기</button></div>
  </div>
</div>

<!-- ============ 2. 단어 ============ -->
<div id="s2" class="hidden">
  <h2>2. 단어 제출</h2>
  <div class="box">
    <div class="note sig">
      전원에게 <b>주제에 맞는 단어 2개씩</b> 받아서 여기에 적으세요. 음성으로 부르게 하면 40초면 끝납니다.<br>
      <b>2~6글자, 그림으로 그릴 수 있는 것.</b> 겹치면 다시 받으세요.
    </div>
    <div id="wordForm"></div>
    <div style="margin-top:14px;">
      <button id="makeGame">게임 만들기</button>
      <button class="ghost" id="backS1">뒤로</button>
      <span class="muted" style="margin-left:10px;">역할·자물쇠가 자동 배정됩니다</span>
    </div>
  </div>
</div>

<!-- ============ 3. 진행 ============ -->
<div id="s3" class="hidden">
  <div class="turnbar">
    <div class="big" id="rdLabel">준비</div>
    <div class="phase" id="phLabel">링크 배포</div>
    <div class="muted" id="metaLabel"></div>
    <div style="margin-left:auto;">
      <button class="ghost sm" id="btnTruth">진실표</button>
      <button class="ghost sm" id="btnReset">처음으로</button>
    </div>
  </div>

  <div id="truth" class="box hidden"></div>

  <div id="panel"></div>

  <h2>단어판</h2>
  <div class="box"><div class="wchips" id="board"></div></div>
</div>

</div>
<script>
"use strict";
function $(i){return document.getElementById(i);}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ri(n){return (Math.random()*n)|0;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var THEMES=["동물","음식","가전제품","탈것","직업","스포츠","학용품","과일"];
var SLOTS=4, ROUNDS=4;
var G=null;

/* ---------- 설정 ---------- */
(function(){
  $("themes").innerHTML = THEMES.map(function(t,i){
    return '<button class="ghost sm" data-t="'+esc(t)+'">'+esc(t)+'</button>';
  }).join("");
  var bs=$("themes").querySelectorAll("button");
  for(var i=0;i<bs.length;i++) bs[i].onclick=function(){
    for(var j=0;j<bs.length;j++) bs[j].className="ghost sm";
    this.className="sm on";
    $("theme").value=this.getAttribute("data-t");
  };
  fillNames();
  $("cnt").onchange=fillNames;
})();

function fillNames(){
  var n=+$("cnt").value;
  var cur=$("names").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
  var out=[];
  for(var i=0;i<n;i++) out.push(cur[i]||("플레이어"+(i+1)));
  $("names").value=out.join("\n");
}

$("toWords").onclick=function(){
  var n=+$("cnt").value;
  var names=$("names").value.split("\n").map(function(s){return s.trim();}).filter(Boolean).slice(0,n);
  if(names.length<n){ alert("이름을 "+n+"개 입력해주세요."); return; }
  if(!$("theme").value.trim()){ alert("주제를 골라주세요."); return; }
  var h='<div class="grid">';
  names.forEach(function(nm,i){
    h+='<div class="pcard"><div class="pname">'+esc(nm)+'</div>'+
       '<input type="text" id="w'+i+'a" placeholder="단어 1" style="margin-bottom:7px;">'+
       '<input type="text" id="w'+i+'b" placeholder="단어 2"></div>';
  });
  h+='</div>';
  $("wordForm").innerHTML=h;
  $("s1").classList.add("hidden"); $("s2").classList.remove("hidden");
};
$("backS1").onclick=function(){ $("s2").classList.add("hidden"); $("s1").classList.remove("hidden"); };

/* ---------- 게임 생성 ---------- */
$("makeGame").onclick=function(){
  var n=+$("cnt").value;
  var names=$("names").value.split("\n").map(function(s){return s.trim();}).filter(Boolean).slice(0,n);
  var words=[], seen={};
  for(var i=0;i<n;i++){
    var a=($("w"+i+"a").value||"").trim(), b=($("w"+i+"b").value||"").trim();
    if(!a||!b){ alert(names[i]+" 의 단어 2개를 채워주세요."); return; }
    if(seen[a]||seen[b]||a===b){ alert("겹치는 단어가 있습니다: "+(seen[a]?a:(seen[b]?b:a))); return; }
    seen[a]=1; seen[b]=1;
    words.push([a,i]); words.push([b,i]);
  }

  var nTr = $("ntr").value==="auto" ? (n>=7?2:1) : +$("ntr").value;
  var tr = sh(names.map(function(_,i){return i;})).slice(0,nTr);

  var ps=names.map(function(nm,i){
    return {id:i,name:nm,role:tr.indexOf(i)>=0?"traitor":"citizen",
            lock:null,iso:0,dead:false,answer:null,escaped:false};
  });

  // 자물쇠: 자기 단어 제외, 같은 제출자 중복 없음
  ps.forEach(function(p){
    var owners=sh(names.map(function(_,i){return i;}).filter(function(i){return i!==p.id;})).slice(0,SLOTS);
    p.lock=sh(owners.map(function(o){
      var mine=[];
      words.forEach(function(w,wi){ if(w[1]===o) mine.push(wi); });
      return mine[ri(mine.length)];
    }));
  });

  // 라운드별 담당 (매 라운드 새 배정, 자기 자신 제외)
  var miss=[];
  for(var r=0;r<ROUNDS;r++){
    var map=null;
    for(var t=0;t<400;t++){
      var perm=sh(ps.map(function(p){return p.id;})), ok=true;
      for(var k=0;k<perm.length;k++) if(perm[k]===k){ok=false;break;}
      if(ok){ map=perm; break; }
    }
    if(!map){ map=ps.map(function(p){return (p.id+1)%n; }); }
    miss.push(map);   // miss[r][보내는사람] = 받는사람
  }

  G={n:n,theme:$("theme").value.trim(),names:names,words:words,ps:ps,
     miss:miss,round:0,phase:"deal",log:[]};

  G.log.push("주제: "+G.theme+" / 인원 "+n+" / 배신자 "+nTr);
  G.log.push("단어판: "+words.map(function(w){return w[0]+"("+names[w[1]]+")";}).join(", "));
  ps.forEach(function(p){
    G.log.push("  "+p.name+" ["+(p.role==="traitor"?"배신자":"참가자")+"] 자물쇠: "+
      p.lock.map(function(wi){return words[wi][0];}).join(" · "));
  });

  $("s2").classList.add("hidden"); $("s3").classList.remove("hidden");
  $("metaLabel").textContent = "주제 「"+G.theme+"」 · "+n+"명 · 배신자 "+nTr+"명";
  renderBoard();
  showDeal();
};

$("btnReset").onclick=function(){ if(confirm("처음으로 돌아갑니다.")) location.reload(); };
$("btnTruth").onclick=function(){ $("truth").classList.toggle("hidden"); renderTruth(); };

function renderBoard(){
  $("board").innerHTML = G.words.map(function(w){
    return '<span class="wchip">'+esc(w[0])+'<small>'+esc(G.names[w[1]])+'</small></span>';
  }).join("");
}

function renderTruth(){
  if($("truth").classList.contains("hidden")) return;
  var h='<h2 style="margin-top:0;">진행자 전용 · 진실표</h2>'+
        '<div class="muted" style="margin-bottom:10px;">화면 공유 금지.</div><div class="tw"><table>'+
        '<tr><th>이름</th><th>역할</th><th>자물쇠 정답 (순서대로)</th><th>독방</th></tr>';
  G.ps.forEach(function(p){
    h+='<tr><td><b>'+esc(p.name)+'</b></td><td>'+
       (p.role==="traitor"?'<span class="chip tr">배신자</span>':'<span class="chip">참가자</span>')+'</td><td>'+
       p.lock.map(function(wi,k){return (k+1)+". "+esc(G.words[wi][0]);}).join("  ·  ")+'</td><td>'+
       (p.dead?'<span class="chip dead">탈락</span>':(p.iso>0?'<span class="chip iso">'+p.iso+'회</span>':'-'))+
       '</td></tr>';
  });
  h+='</table></div>';
  $("truth").innerHTML=h;
}

/* ---------- 링크 ---------- */
function playLink(i){
  var p=G.ps[i];
  var data={v:1,t:G.theme,n:G.names,w:G.words,me:i,r:p.role==="traitor"?"t":"c",s:SLOTS,
            m:G.miss.map(function(map,r){
              var to=map[i];
              return [to, G.ps[to].lock[r]];
            })};
  var b64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  var base=location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/,"");
  return base+"play.html#"+b64;
}

function copyText(txt,tag){
  var t=document.createElement("textarea");
  t.value=txt; t.style.position="fixed"; t.style.top="-2000px"; t.style.opacity="0";
  document.body.appendChild(t); t.focus(); t.select(); t.setSelectionRange(0,999999);
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  if($(tag)){ $(tag).textContent = ok?"복사됨":"복사 실패"; setTimeout(function(){ if($(tag)) $(tag).textContent=""; },1600); }
}

/* ---------- 링크 배포 ---------- */
function showDeal(){
  G.phase="deal";
  $("rdLabel").textContent="준비";
  $("phLabel").textContent="링크 배포";
  var h='<div class="note sig"><b>각자에게 링크를 하나씩 보내세요.</b> '+
    '이 링크 하나에 4라운드 임무가 전부 들어 있습니다. 라운드마다 다시 보낼 필요가 없습니다.<br>'+
    '링크를 연 사람은 자기 역할, 단어판, 그리고 <b>매 라운드 누구에게 무엇을 그려야 하는지</b>를 봅니다.</div>';
  h+='<div class="note"><b>그림은 프로그램을 거치지 않습니다.</b> 각자 링크 안 캔버스에 그린 뒤, '+
    '그림을 <b>받는 사람에게 직접</b> 카톡으로 보내면 됩니다. 방장은 중계할 필요가 없습니다.</div>';
  h+='<h2>개인 링크</h2><div class="grid">';
  G.ps.forEach(function(p,i){
    h+='<div class="pcard"><div class="pname">'+esc(p.name)+
       (p.role==="traitor"?' <span class="chip tr">배신자</span>':'')+'</div>'+
       '<div class="muted" style="word-break:break-all;font-size:11px;max-height:52px;overflow:hidden;" id="lt'+i+'"></div>'+
       '<div style="margin-top:9px;"><button class="sm" id="lk'+i+'">링크 복사</button>'+
       '<span class="copied" id="lc'+i+'"></span></div></div>';
  });
  h+='</div><div style="margin-top:16px;"><button id="startR">1라운드 시작</button></div>';
  $("panel").innerHTML=h;
  G.ps.forEach(function(p,i){
    var url=playLink(i);
    $("lt"+i).textContent=url;
    $("lk"+i).onclick=function(){ copyText(url,"lc"+i); };
  });
  $("startR").onclick=function(){ G.round=1; showRound(); };
}

/* ---------- 라운드 ---------- */
function showRound(){
  G.phase="round";
  $("rdLabel").textContent=G.round+" / "+ROUNDS+" 라운드";
  $("phLabel").textContent="밤 → 낮 → 투표";
  renderTruth();

  var alive=G.ps.filter(function(p){return !p.dead;});
  var h='<div class="note"><b>밤</b> — 각자 자기 링크에서 <b>R'+G.round+'</b>를 펼쳐 그림을 그리고, '+
    '받는 사람에게 카톡으로 보냅니다. 20초 타이머는 각자 화면에 있습니다.</div>';
  h+='<div class="note sig"><b>낮</b> — 다 같이 떠듭니다. "나는 ○○에게 △△를 그렸다", "나는 □□로 봤다"를 맞춰보게 하세요.<br>'+
    '어긋나는 구간이 나오면 그게 단서입니다. 단, <b>못 그려서 그런 건지 일부러 그런 건지는 아무도 모릅니다.</b></div>';

  h+='<h2>이번 라운드 담당</h2><div class="tw"><table><tr><th>그리는 사람</th><th>받는 사람</th><th>상태</th></tr>';
  G.ps.forEach(function(p,i){
    var to=G.miss[G.round-1][i];
    var iso = p.isoRound===G.round;
    h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(G.names[to])+'</td><td>'+
       (p.dead?'<span class="chip dead">탈락 · 제외</span>':
        iso?'<span class="chip iso">독방 · 이번 라운드 쉼</span>':'<span class="chip">정상</span>')+'</td></tr>';
  });
  h+='</table></div>';

  h+='<h2>투표</h2><div class="box"><div class="muted" style="margin-bottom:10px;">'+
    '회의가 끝나면 지목된 사람을 고르세요. 독방에 가면 <b>다음 라운드에 그리지도 받지도 못합니다.</b> 두 번이면 탈락.</div>'+
    '<div class="row"><div style="max-width:240px;"><select id="vsel"><option value="-1">지목 없음</option>';
  alive.forEach(function(p){ h+='<option value="'+p.id+'">'+esc(p.name)+'</option>'; });
  h+='</select></div><div style="max-width:200px;"><button id="btnVote">확정하고 '+
     (G.round>=ROUNDS?'최종으로':'다음 라운드')+'</button></div></div></div>';

  $("panel").innerHTML=h;
  $("btnVote").onclick=function(){
    var v=+$("vsel").value;
    G.log.push("--- "+G.round+"라운드 투표: "+(v<0?"지목 없음":G.ps[v].name)+" ---");
    if(v>=0){
      var t=G.ps[v]; t.iso++; t.isoRound=G.round+1;
      if(t.iso>=2){ t.dead=true; alert(t.name+" 두 번째 지목 — 탈락합니다. 탈출 실패로 집계됩니다."); }
      else alert(t.name+" 독방행. 다음 라운드에 그리지도 받지도 못합니다.");
    }
    if(G.round>=ROUNDS) showFinal();
    else { G.round++; showRound(); }
  };
}

/* ---------- 최종 ---------- */
function showFinal(){
  G.phase="final";
  $("rdLabel").textContent="최종";
  $("phLabel").textContent="자물쇠 개방";
  var h='<div class="note"><b>각자 자기 자물쇠 단어 네 개를 순서대로 말하게 하세요.</b> 들은 대로 입력하면 됩니다. '+
    '(각자 화면 아래쪽에 자기가 적어둔 추측이 있습니다.)</div>';
  h+='<div class="grid">';
  G.ps.forEach(function(p,i){
    h+='<div class="pcard"><div class="pname">'+esc(p.name)+
       (p.dead?' <span class="chip dead">탈락</span>':'')+'</div>';
    if(!p.dead){
      for(var k=0;k<SLOTS;k++){
        h+='<div style="margin-bottom:6px;"><label>'+(k+1)+'번</label>'+
           '<select id="a'+i+'_'+k+'">'+G.words.map(function(w,wi){
             return '<option value="'+wi+'">'+esc(w[0])+' ('+esc(G.names[w[1]])+')</option>';
           }).join("")+'</select></div>';
      }
    } else {
      h+='<div class="muted">탈락 — 입력하지 않습니다.</div>';
    }
    h+='</div>';
  });
  h+='</div><div style="margin-top:16px;"><button id="btnJudge">판정</button></div>';
  $("panel").innerHTML=h;
  $("btnJudge").onclick=judge;
}

function judge(){
  var need = G.n>=7?3:2;
  G.log.push("--- 최종 판정 ---");
  G.ps.forEach(function(p,i){
    if(p.dead){ p.escaped=false; p.answer=null; return; }
    var ans=[];
    for(var k=0;k<SLOTS;k++) ans.push(+$("a"+i+"_"+k).value);
    p.answer=ans;
    p.escaped=ans.every(function(wi,k){ return wi===p.lock[k]; });
    G.log.push("  "+p.name+" 제출: "+ans.map(function(wi){return G.words[wi][0];}).join(" · ")+
      " → "+(p.escaped?"탈출":"실패 (정답 "+p.lock.map(function(wi){return G.words[wi][0];}).join(" · ")+")"));
  });
  var failed=G.ps.filter(function(p){return !p.escaped;});
  var win = failed.length>=need;
  G.log.push("  실패 "+failed.length+"명 → "+(win?"배신자 승리":"참가자 승리"));
  G.log.push("  배신자: "+G.ps.filter(function(p){return p.role==="traitor";}).map(function(p){return p.name;}).join(", "));

  var h='<div class="box"><div style="font-size:24px;font-weight:700;letter-spacing:3px;margin-bottom:8px;color:'+
    (win?"#ff7b7b":"#6ee7a0")+'">'+(win?"배신자 승리":"참가자 승리")+'</div>'+
    '<div class="muted" style="margin-bottom:14px;">탈출 실패 '+failed.length+'명 (배신자 승리 조건 '+need+'명 이상)</div>'+
    '<div class="tw"><table><tr><th>이름</th><th>역할</th><th>결과</th><th>제출</th><th>정답</th><th>틀린 칸</th></tr>';
  G.ps.forEach(function(p){
    var wrong = p.answer ? p.answer.map(function(wi,k){return wi===p.lock[k]?null:(k+1)+"번";}).filter(Boolean).join(", ") : "-";
    h+='<tr><td><b>'+esc(p.name)+'</b></td>'+
      '<td>'+(p.role==="traitor"?'<span class="chip tr">배신자</span>':'<span class="chip">참가자</span>')+'</td>'+
      '<td class="'+(p.escaped?"ok":"bad")+'">'+(p.escaped?"탈출":(p.dead?"탈락":"실패"))+'</td>'+
      '<td>'+(p.answer?p.answer.map(function(wi){return esc(G.words[wi][0]);}).join(" · "):'<span class="muted">-</span>')+'</td>'+
      '<td>'+p.lock.map(function(wi){return esc(G.words[wi][0]);}).join(" · ")+'</td>'+
      '<td class="bad">'+(wrong||"-")+'</td></tr>';
  });
  h+='</table></div></div>';
  h+='<h2>복기용 로그</h2><div class="box"><textarea id="logBox" style="min-height:230px;"></textarea>'+
     '<div style="margin-top:10px;"><button class="ghost" id="cpLog">로그 복사</button>'+
     '<span class="copied" id="lcx"></span>'+
     '<button class="ghost" style="margin-left:8px;" onclick="location.reload()">새 게임</button></div></div>';
  $("panel").innerHTML=h;
  $("logBox").value=G.log.join("\n");
  $("cpLog").onclick=function(){ copyText($("logBox").value,"lcx"); };
  $("phLabel").textContent="결과";
  renderTruth();
}
</script>
</body>
</html>
