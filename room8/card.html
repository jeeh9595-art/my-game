<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>8호실 · 내 정보</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#0f1216;color:#e3e9ed;
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       font-size:15px;line-height:1.85;-webkit-text-size-adjust:100%;}
  .wrap{max-width:620px;margin:0 auto;padding:22px 18px 60px;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .badge{font-size:11px;letter-spacing:2px;color:#45c2b7;border:1px solid #1d4a46;
         background:#12302e;border-radius:20px;padding:4px 12px;}
  h1{font-size:19px;margin:0;letter-spacing:2px;font-weight:700;}
  .warn{background:#35201e;border-left:3px solid #e8695e;border-radius:0 8px 8px 0;
        padding:11px 15px;font-size:13.5px;color:#f0c9c5;margin-bottom:16px;}
  .warn b{color:#e8695e;}
  pre{white-space:pre-wrap;word-break:break-word;margin:0;
      font-family:inherit;font-size:15px;line-height:1.95;
      background:#161b21;border:1px solid #232b33;border-radius:12px;padding:18px 20px;}
  .veil{position:fixed;inset:0;background:#0f1216;z-index:10;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        text-align:center;padding:30px;}
  .veil p{color:#7d8894;font-size:14px;margin:0;max-width:340px;line-height:1.9;}
  button{font:inherit;font-size:16px;border:none;border-radius:10px;
         padding:13px 30px;background:#4c7dfc;color:#fff;cursor:pointer;}
  button:hover{background:#3f6ce0;}
  button.ghost{background:#2c343d;font-size:14px;padding:10px 22px;}
  .foot{margin-top:20px;text-align:center;}
  .err{color:#e8695e;font-size:14px;}
</style>
</head>
<body>

<div class="veil" id="veil">
  <div class="badge">8 호 실</div>
  <p>이 화면에는 <b style="color:#e3e9ed">당신만 알아야 하는 정보</b>가 들어 있습니다.<br>주변에 아무도 없을 때 여세요.</p>
  <button id="open">내 정보 보기</button>
</div>

<div class="wrap">
  <div class="top">
    <div class="badge">8 호 실</div>
    <h1>내 정보</h1>
  </div>
  <div class="warn"><b>절대 남에게 보여주지 마세요.</b> 화면을 공유하거나 캡처해서 올리면 그 판은 끝입니다.</div>
  <pre id="body">불러오는 중…</pre>
  <div class="foot"><button class="ghost" id="hide">화면 가리기</button></div>
</div>

<script>
(function(){
  function decode(h){
    try { return decodeURIComponent(escape(atob(h))); } catch(e){ return null; }
  }
  var raw = location.hash.replace(/^#/, "");
  var txt = raw ? decode(raw) : null;
  document.getElementById("body").textContent =
    txt || "정보를 불러오지 못했습니다. 진행자에게 링크를 다시 받아주세요.";
  if(!txt) document.getElementById("body").className = "err";

  var veil = document.getElementById("veil");
  document.getElementById("open").onclick = function(){ veil.style.display = "none"; };
  document.getElementById("hide").onclick = function(){
    veil.style.display = "flex";
    window.scrollTo(0,0);
  };
})();
</script>
</body>
</html>
