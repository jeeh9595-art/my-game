<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1分 目利きゲーム</title>
<style>
*{box-sizing:border-box}
:root{
 --ink:#25221f; --paper:#fbf7ed; --grid:#e8e1d5; --pink:#f6a4a6;
 --mint:#b9dfa4; --blue:#9ed1ed; --yellow:#f8d66e; --purple:#cdb8e8;
}
body{
 margin:0;min-height:100vh;background:#e7dfd2;color:var(--ink);
 font-family:"Comic Sans MS","Trebuchet MS","Yu Gothic",sans-serif;
 display:flex;align-items:center;justify-content:center;padding:18px;
}
.game{
 width:min(1500px,98vw);min-height:900px;background:var(--paper);
 border:4px solid var(--ink);border-radius:24px;padding:28px 30px 20px;
 box-shadow:0 8px 0 rgba(37,34,31,.14);
 position:relative;overflow:hidden;
 zoom:.82;
}
.game:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
 background:repeating-linear-gradient(0deg,transparent 0,transparent 5px,rgba(120,100,80,.025) 6px)}
.top{display:grid;grid-template-columns:330px 1fr 150px;align-items:center;gap:20px;height:125px}
.title{
 display:inline-block;justify-self:start;padding:18px 28px;background:#fff9e9;
 border:4px solid var(--ink);transform:rotate(-4deg);font-size:36px;font-weight:900;
 box-shadow:3px 3px 0 var(--ink);position:relative
}
.title:before{content:"★";position:absolute;left:-28px;top:-18px;font-size:43px;color:#ffe28c;-webkit-text-stroke:3px var(--ink)}
.title:after{content:"★";position:absolute;right:-45px;bottom:-13px;font-size:24px}
.timerWrap{text-align:center;position:relative}
.timer{font-size:68px;line-height:1;font-weight:900;letter-spacing:2px}
.alarm{font-size:62px;display:inline-block;margin-right:16px;vertical-align:middle;filter:saturate(.8)}
.timerLine{height:9px;width:290px;margin:10px auto 0;background:var(--pink);border-radius:50%;transform:rotate(-2deg)}
.topBtns{display:flex;gap:15px;justify-content:flex-end}
.iconBtn{
 width:60px;height:60px;background:#fff;border:4px solid #777;border-radius:12px;
 font-size:30px;color:#555;box-shadow:2px 2px 0 #999;cursor:pointer
}
.content{display:grid;grid-template-columns:1fr 300px;gap:34px;margin-top:8px}
.board{
 height:650px;border:4px solid var(--ink);border-radius:20px;position:relative;overflow:hidden;
 background-color:#fffdf8;
 background-image:linear-gradient(#eee7dc 1px,transparent 1px),linear-gradient(90deg,#eee7dc 1px,transparent 1px);
 background-size:32px 32px;
}
.tape{position:absolute;width:125px;height:38px;z-index:4;opacity:.82;border:3px solid var(--ink)}
.tape.a{left:-18px;top:5px;background:var(--mint);transform:rotate(-34deg)}
.tape.b{right:-18px;bottom:0;background:var(--pink);transform:rotate(-33deg)}
#field{position:absolute;left:20px;right:20px;top:20px;bottom:20px}
.cardNum{
 position:absolute;width:92px;height:92px;background:#fffdf7;border:4px solid var(--ink);
 border-radius:9px;color:var(--ink);font-size:39px;font-weight:900;cursor:pointer;
 box-shadow:5px 6px 0 var(--yellow);transition:.08s;z-index:2
}
.cardNum:nth-child(5n+2){box-shadow:5px 6px 0 var(--pink)}
.cardNum:nth-child(5n+3){box-shadow:5px 6px 0 var(--blue)}
.cardNum:nth-child(5n+4){box-shadow:5px 6px 0 var(--mint)}
.cardNum:nth-child(5n){box-shadow:5px 6px 0 var(--purple)}
.cardNum:hover{transform:translate(-2px,-3px) rotate(-2deg)}
.cardNum:active{transform:translate(4px,5px);box-shadow:1px 1px 0 var(--ink)}
.cardNum.target{outline:5px solid #f26b67;outline-offset:0}
.side{display:flex;flex-direction:column;gap:18px}
.panel{
 background:#fffdf8;border:4px solid var(--ink);border-radius:18px;padding:20px 22px;
 box-shadow:3px 4px 0 rgba(37,34,31,.12)
}
.panel h3{font-size:27px;margin:0 0 10px;font-weight:900}
.panel h3:before{content:"☆";font-size:30px;margin-right:9px}
.score{font-size:62px;text-align:center;margin:0 0 15px;font-weight:900}
.rule{border-top:3px dashed #aaa096;margin:8px 0 16px}
.comboTitle{font-size:25px;font-weight:900}.combo{font-size:45px;text-align:center;font-weight:900}
.comboMsg{color:#ee8f22;text-align:right;font-size:23px;font-weight:900}
.level{font-size:35px;text-align:center}.progress{height:20px;border:4px solid var(--ink);border-radius:20px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;width:30%;background:var(--mint);border-radius:12px}
.best{text-align:center;font-size:40px;font-weight:900}
.restart{
 border:4px solid var(--ink);border-radius:18px;background:var(--pink);font-size:29px;
 font-weight:900;padding:18px;box-shadow:4px 5px 0 var(--ink);cursor:pointer
}
.restart:active{transform:translate(4px,5px);box-shadow:0 0 0 var(--ink)}
.hint{
 margin-top:18px;border:4px solid #c9a65c;background:#fff9df;border-radius:5px;
 padding:11px 24px;text-align:center;font-size:23px;font-weight:900
}
.hint b{color:#e35d5d}
.overlay{position:absolute;inset:0;background:rgba(251,247,237,.92);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{
 width:min(520px,88%);text-align:center;background:#fffdf8;border:4px solid var(--ink);
 border-radius:20px;padding:34px;box-shadow:7px 8px 0 var(--ink);transform:rotate(-1deg)
}
.modal h2{font-size:42px;margin:0 0 12px}.modal p{font-size:19px;line-height:1.7;font-weight:700}
.start{
 background:var(--pink);border:4px solid var(--ink);border-radius:15px;padding:15px 36px;
 font-size:23px;font-weight:900;box-shadow:4px 5px 0 var(--ink);cursor:pointer
}
.start:active{transform:translate(4px,5px);box-shadow:none}
.hidden{display:none}
#message{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:20px;font-weight:900;z-index:5}
@media(max-width:1050px){
 .game{min-height:auto}.top{grid-template-columns:280px 1fr 130px}.title{font-size:29px}.timer{font-size:55px}
 .content{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,1fr)}.restart{grid-column:1/-1}
 .board{height:600px}
}
@media(max-width:650px){
 body{padding:6px}.game{padding:15px;border-width:3px;zoom:1}.top{grid-template-columns:1fr auto;height:100px}
 .title{font-size:22px;padding:12px 17px}.timer{font-size:40px}.alarm{font-size:38px;margin-right:5px}.timerLine{width:180px}
 .topBtns{display:none}.content{gap:10px}.board{height:520px}.side{grid-template-columns:1fr 1fr;gap:8px}
 .panel{padding:12px}.panel h3{font-size:19px}.score{font-size:38px}.best,.level{font-size:28px}.combo{font-size:32px}
 .hint{font-size:15px;padding:9px}.cardNum{width:68px;height:68px;font-size:28px}
}
</style>
</head>
<body>
<div class="game">
 <div class="top">
  <div class="title">1分 目利きゲーム</div>
  <div class="timerWrap"><span class="alarm">⏰</span><span class="timer" id="time">60.00</span><div class="timerLine"></div></div>
  <div class="topBtns"><button class="iconBtn" id="sound" title="音量">🔊</button><button class="iconBtn" id="pause" title="一時停止">Ⅱ</button></div>
 </div>

 <div class="content">
  <section>
   <div class="board">
    <div class="tape a"></div><div class="tape b"></div>
    <div id="field"></div><div id="message"></div>
    <div class="overlay" id="overlay">
     <div class="modal">
      <h2 id="modalTitle">準備できた？</h2>
      <p id="modalText">1〜100の数字の中から、<br><b>一番大きい数字</b>を見つけてクリックしてください！<br>毎回数字はランダムに変わります。制限時間は1分です。</p>
      <button class="start" id="start">ゲームスタート</button>
     </div>
    </div>
   </div>
   <div class="hint">💡 <b>1分間</b>、1〜100の中から<b>一番大きい数字</b>を探してください！</div>
  </section>

  <aside class="side">
   <div class="panel">
    <h3>点数</h3><div class="score" id="score">0</div>
    <div class="rule"></div>
    <div class="comboTitle">🔥 コンボ</div><div class="combo" id="combo">0</div>
    <div class="comboMsg" id="comboMsg"></div>
   </div>
   <div class="panel">
    <h3>難易度</h3><div class="level" id="level">Lv. 1</div>
    <div class="progress"><div id="levelBar"></div></div>
   </div>
   <div class="panel">
    <h3>最高スコア</h3><div class="best" id="best">0</div>
   </div>
   <button class="restart" id="restart">もう一度 ↻</button>
  </aside>
 </div>
</div>


<script>
/* Original Web Audio sound engine — no external copyrighted audio files. */
const AudioFX = (() => {
  let ctx = null, master = null, musicGain = null, musicTimer = null;
  let enabled = true, musicOn = true, step = 0;

  function init() {
    if (ctx) {
      if (ctx.state === "suspended") ctx.resume();
      return;
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.16; master.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.035; musicGain.connect(master);
  }
  function tone(freq, duration=.08, type="sine", volume=.12, when=0) {
    if (!enabled || !ctx) return;
    const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + duration + .02);
  }
  function chord(notes, dur=.28) {
    notes.forEach((n,i)=>tone(n,dur,"triangle",.045,i*.025));
  }
  function startMusic() {
    if (!musicOn || !ctx || musicTimer) return;
    const scale=[261.63,293.66,329.63,392.00,440.00,392.00,329.63,293.66];
    musicTimer=setInterval(()=>{
      if (!musicOn || !enabled) return;
      const n=scale[step++ % scale.length];
      tone(n,.22,"triangle",.018);
      if(step%8===1) tone(n/2,.38,"sine",.012);
    },520);
  }
  function stopMusic(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }
  return {
    enable(){enabled=true;init();},
    stopMusic(){stopMusic();},
    toggle(){enabled=!enabled;if(enabled){init();startMusic();}else stopMusic();return enabled;},
    musicToggle(){musicOn=!musicOn;if(musicOn){init();startMusic();}else stopMusic();return musicOn;},
    start(){init();chord([392,523.25,659.25],.18);startMusic();},
    correct(combo=0){tone(660,.07,"sine",.07);tone(combo>=3?988:784,.10,"triangle",.055,.055);},
    wrong(){tone(170,.12,"square",.045);tone(120,.14,"square",.03,.07);},
    combo(){chord([523.25,659.25,783.99],.22);},
    level(){chord([523.25,659.25,783.99,1046.5],.3);},
    end(){chord([659.25,523.25,392],.35);},
    click(){tone(430,.035,"sine",.025);}
  };
})();
</script>

<script>
const field=document.getElementById('field'), overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'), comboEl=document.getElementById('combo'), bestEl=document.getElementById('best');
const timeEl=document.getElementById('time'), levelEl=document.getElementById('level'), levelBar=document.getElementById('levelBar');
const comboMsg=document.getElementById('comboMsg'), modalTitle=document.getElementById('modalTitle'), modalText=document.getElementById('modalText');
let score=0,combo=0,correct=0,level=1,time=60,running=false,paused=false,timer=null;
let best=Number(localStorage.getItem('oneMinuteBest')||0);bestEl.textContent=best;
let soundOn=true;

function clearField(){field.innerHTML=''}
function overlap(a,b,g=16){return !(a.right+g<b.left||a.left>b.right+g||a.bottom+g<b.top||a.top>b.bottom+g)}
function spawn(){
 clearField();
 const count=Math.min(8+Math.floor(correct/8),13);

 // Every round gets a completely shuffled set of numbers from 1~100.
 // The target is NOT tied to the previous round, so there is no predictable
 // 1 → 5 → 10 style progression.
 const vals=[];
 const pool=Array.from({length:100},(_,i)=>i+1);
 for(let i=pool.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [pool[i],pool[j]]=[pool[j],pool[i]];
 }
 for(let i=0;i<count;i++) vals.push(pool[i]);
 vals.sort(()=>Math.random()-.5);
 const W=field.clientWidth,H=field.clientHeight, boxes=[];
 vals.forEach((v,i)=>{
   const el=document.createElement('button');el.className='cardNum';el.textContent=v;
   const size=window.innerWidth<=650?68:92;el.style.width=size+'px';el.style.height=size+'px';
   let ok=false;
   for(let n=0;n<500&&!ok;n++){
     const x=8+Math.random()*Math.max(8,W-size-16);
     const y=75+Math.random()*Math.max(8,H-size-90);
     const r={left:x,top:y,right:x+size,bottom:y+size};
     if(!boxes.some(b=>overlap(r,b))){boxes.push(r);el.style.left=x+'px';el.style.top=y+'px';ok=true}
   }
   field.appendChild(el);
 });
}
field.onclick=(e)=>{
 const el=e.target.closest('.cardNum');
 if(!el || !running || paused)return;
 const v=Number(el.textContent);
 const nums=[...field.querySelectorAll('.cardNum')].map(x=>Number(x.textContent));
 const max=Math.max(...nums);
 if(v===max){
   AudioFX.correct(combo);
   score += 5 + Math.floor(combo/5);
   combo++; correct++;
   if(combo%8===0){ level=Math.min(10,level+1); AudioFX.level(); }
   if(combo>0 && combo%3===0) AudioFX.combo();
   comboMsg.textContent=combo>=3?'連続正解！':'';
 }else{
   AudioFX.wrong();
   combo=0;
   comboMsg.textContent='もう一度！';
 }
 update();
 spawn();
};

function update(){
 scoreEl.textContent=score;comboEl.textContent=combo;levelEl.textContent='Lv. '+level;
 levelBar.style.width=Math.min(100,20+(level-1)*9)+'%';
}
function startGame(){
 AudioFX.start();
 score=combo=correct=0;level=1;time=60;running=true;paused=false;
 modalTitle.textContent='ゲームスタート！';update();overlay.classList.add('hidden');
 const begin=performance.now();clearInterval(timer);spawn();
 timer=setInterval(()=>{
   if(paused)return;
   time=Math.max(0,60-(performance.now()-begin)/1000 + (paused?0:0));
   // pause is handled by freezing elapsed with a separate accumulator below
 },50);
 // Replace timer with pause-safe clock.
 clearInterval(timer);
 let last=performance.now(),remaining=60;
 timer=setInterval(()=>{
   if(!running)return;
   const now=performance.now();
   if(!paused){remaining-= (now-last)/1000;}
   last=now;time=Math.max(0,remaining);
   timeEl.textContent=time.toFixed(2);
   if(time<=0)endGame();
 },20);
}
function endGame(){
 if(!running)return; AudioFX.end(); AudioFX.stopMusic();running=false;clearInterval(timer);clearField();time=0;timeEl.textContent='0.00';
 if(score>best){best=score;localStorage.setItem('oneMinuteBest',best);bestEl.textContent=best}
 modalTitle.textContent='ゲーム終了！';
 modalText.innerHTML=`あなたのスコアは <b>${score}点</b>！<br>正解 ${correct}回 ・ 最大コンボ ${combo}回`;
 document.getElementById('start').textContent='もう一度プレイ';
 overlay.classList.remove('hidden');
}
document.getElementById('start').onclick=()=>{
  AudioFX.enable();
  if (paused && running) {
    paused=false;
    overlay.classList.add('hidden');
    document.getElementById('pause').textContent='Ⅱ';
  } else {
    startGame();
  }
};
document.getElementById('restart').onclick=startGame;
document.getElementById('pause').onclick=()=>{
 if(!running)return;
 paused=!paused;
 document.getElementById('pause').textContent=paused?'▶':'Ⅱ';
 if(paused){modalTitle.textContent='一時停止';modalText.textContent='準備ができたら下のボタンを押してください。';document.getElementById('start').textContent='ゲームに戻る';overlay.classList.remove('hidden')}
 else overlay.classList.add('hidden');
};
document.getElementById('sound').onclick=()=>{
 soundOn=AudioFX.toggle();
 document.getElementById('sound').textContent=soundOn?'🔊':'🔇';
};
</script>
</body>
</html>
