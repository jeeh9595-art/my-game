<title>기억력 카드 뒤집기 — TinyPlay</title>

<style>
@font-face{
 font-family:'DungGeunMo';
 src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.woff') format('woff');
 font-display:swap;
}
*{box-sizing:border-box}
body{margin:0;background:#f4f4f2;color:#202329;font-family:Arial,"Noto Sans KR",sans-serif}

/* ===== 공통 헤더 (메인화면과 동일) ===== */
.topbar{position:sticky;top:0;z-index:60;background:rgba(7,7,15,.95);border-bottom:2px solid #28e6ff;
 box-shadow:0 0 14px rgba(40,230,255,.35);font-family:'DungGeunMo','Press Start 2P',monospace}
.topbar .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.topbar .nav{display:flex;align-items:center;gap:20px;padding:14px 0}
.topbar a{text-decoration:none}
.topbar .logo{display:inline-block;font-family:'Press Start 2P',monospace;font-size:17px;color:#28e6ff;
 text-shadow:0 0 5px #28e6ff,0 0 14px rgba(40,230,255,.7)}
.topbar .logo .p2{color:#ff2fb0;text-shadow:0 0 5px #ff2fb0,0 0 14px rgba(255,47,176,.7)}
.topbar .menu{display:flex;gap:8px;margin-left:8px}
.topbar .menu a{font-size:13px;padding:7px 12px;border:2px solid #2a2a4d;color:#8f8fc0}
.topbar .menu a:hover{border-color:#ffe23d;color:#ffe23d;text-shadow:0 0 8px rgba(255,226,61,.7)}
.topbar .coin{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:10px;color:#ffe23d;
 display:flex;align-items:center;gap:8px}
.topbar .coin .inf{text-shadow:0 0 8px rgba(255,226,61,.7)}
.topbar .search{display:flex;align-items:center;gap:8px;background:#0a0a18;border:2px solid #ff2fb0;
 padding:8px 12px;color:#ff2fb0}
.topbar .search input{border:0;background:transparent;color:#fff;outline:none;width:150px;
 font-family:'DungGeunMo',monospace;font-size:15px}
.topbar .search input::placeholder{color:#6a6a9a}
@media(max-width:720px){.topbar .menu{display:none}.topbar .coin{display:none}.topbar .search input{width:110px}}
.pagewrap{display:flex;justify-content:center;align-items:flex-start;gap:20px;max-width:1400px;margin:0 auto;padding:25px 18px}
.sidead{flex:none;width:160px;min-height:600px;border:1px solid #dedfe3;background:#fff;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;position:sticky;top:84px;writing-mode:vertical-rl;letter-spacing:4px}
@media(max-width:1100px){.sidead{display:none}.pagewrap{padding:16px 10px}}
footer{height:110px;background:#10182d;color:#9299aa;padding:28px 34px;font-size:12px}

/* ===== 게임 전용 (기억력 카드 뒤집기) ===== */
.stage{flex:1;min-width:0;max-width:1050px;padding:0 0 50px;display:flex;flex-direction:column;align-items:center}
.gtitle{width:100%;max-width:460px;text-align:center;margin:0 auto 18px}
.gtitle h1{font-size:24px;margin:0 0 8px;font-weight:800;letter-spacing:-.5px;color:#12121f}
.gtitle p{margin:0;color:#666;font-size:13px}

.mgbar{width:100%;max-width:460px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 16px}
.mgbar .cell{background:#0f1122;border:1px solid #23234a;border-radius:10px;padding:12px 8px;text-align:center;color:#8f8fc0}
.mgbar .cell span{display:block;font-size:11px;letter-spacing:.5px;margin-bottom:6px;color:#7a7aa8}
.mgbar .cell b{font-size:20px;font-weight:800;color:#28e6ff;font-family:'Press Start 2P',monospace;text-shadow:0 0 8px rgba(40,230,255,.5)}

.board-wrap{width:100%;max-width:460px;position:relative;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{position:relative;aspect-ratio:1/1;cursor:pointer;perspective:700px;background:transparent;padding:0;border:0}
.mcard .inner{position:absolute;inset:0;transition:transform .35s ease;transform-style:preserve-3d;border-radius:14px}
.mcard.flip .inner,.mcard.matched .inner{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(28px,9vw,44px);user-select:none}
.mcard .back{background:radial-gradient(circle at 50% 35%,#161634,#0a0a18);border:2px solid #28e6ff;
 box-shadow:0 0 12px rgba(40,230,255,.45),inset 0 0 12px rgba(40,230,255,.2);color:#28e6ff;
 font-family:'Press Start 2P',monospace;font-size:26px;text-shadow:0 0 10px rgba(40,230,255,.8)}
.mcard .front{background:linear-gradient(160deg,#20223f,#12121f);border:2px solid #ff2fb0;
 box-shadow:0 0 12px rgba(255,47,176,.4);transform:rotateY(180deg)}
.mcard.matched .front{border-color:#4caf62;box-shadow:0 0 14px rgba(76,175,98,.6);animation:pop .35s ease}
.mcard.matched{cursor:default}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.mcard:hover .back{box-shadow:0 0 18px rgba(40,230,255,.7),inset 0 0 12px rgba(40,230,255,.25)}

.mgactions{margin-top:20px;text-align:center}
.mgactions button{background:#20263a;color:#fff;border:0;padding:11px 26px;font-size:14px;cursor:pointer;border-radius:8px;font-weight:700}
.mgactions button:hover{background:#303852}

.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
 background:rgba(7,7,15,.92);border-radius:14px;text-align:center;padding:20px;z-index:5}
.overlay.show{display:flex}
.overlay .done{font-family:'Press Start 2P',monospace;font-size:24px;color:#ffe23d;text-shadow:0 0 12px rgba(255,226,61,.7);margin-bottom:16px}
.overlay .res{color:#cfd3e0;font-size:14px;line-height:1.9;margin-bottom:20px}
.overlay .res b{color:#28e6ff}
.overlay button{background:#ff2fb0;color:#fff;border:0;padding:12px 30px;font-size:15px;cursor:pointer;border-radius:8px;font-weight:700;box-shadow:0 0 14px rgba(255,47,176,.5)}
.overlay button:hover{filter:brightness(1.1)}

.desc{width:100%;max-width:460px;margin:26px auto 0;background:#fff;border:1px solid #dedfe3;border-radius:10px;padding:22px 24px}
.desc h2{font-size:16px;margin:0 0 12px}
.desc p{margin:6px 0;color:#666;font-size:13px;line-height:1.7}
@media(max-width:700px){.stage{padding:0 0 35px}.board{gap:8px}.mgbar{gap:8px}}
</style>
<style>
/* TinyPlay 다크 테마 통일 */
body{background:#0e0c1a!important;color:#eaeaff!important}
.sidead{background:#15132a!important;border:1px solid #2a2a4d!important;color:#6a6a9a!important}
.gtitle{background:transparent!important;border:none!important}
.gtitle h1{color:#28e6ff!important}
.gtitle p{color:#9aa0c0!important}
.description,.desc,.mine-desc{background:#15132a!important;border:1px solid #2a2a4d!important;border-radius:12px!important}
.description h2,.desc h2,.mine-desc h2{color:#ffe23d!important}
.description p,.desc p,.mine-desc p{color:#c9cbe6!important}
</style>
</head>
<body>
<header class="topbar">
 <div class="wrap nav">
  <a class="logo" href="../">TINY<span class="p2">PLAY</span></a>
  <div class="menu"><a href="../">홈</a><a href="../#games">게임</a><a href="../#about">소개</a></div>
  <div class="coin">🪙 CREDIT&nbsp;<span class="inf">∞</span></div>
  <div class="search">🔎<input id="q" placeholder="게임 검색..." onkeydown="if(event.key==='Enter')location.href='../#games'"></div>
 </div>
</header>

<div class="pagewrap">
<aside class="sidead">광고 영역</aside>
<main class="stage">

  <div class="gtitle">
    <h1>기억력 카드 뒤집기</h1>
    <p>같은 그림 카드 두 장을 찾아보세요!</p>
  </div>

  <div class="mgbar">
    <div class="cell"><span>시도</span><b id="moves">0</b></div>
    <div class="cell"><span>시간</span><b id="time">00:00</b></div>
    <div class="cell"><span>최고 기록</span><b id="best">-</b></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div class="done">완료!</div>
      <div class="res" id="result"></div>
      <button onclick="newGame()">다시 시작</button>
    </div>
  </div>

  <div class="mgactions"><button onclick="newGame()">새 게임</button></div>

  <section class="desc">
    <h2>게임 방법</h2>
    <p>카드를 클릭하면 뒤집혀 그림이 나타납니다.</p>
    <p>두 장을 뒤집어 같은 그림이면 그대로 남고, 다르면 다시 뒤집힙니다.</p>
    <p>8쌍의 카드를 모두 맞추면 완료! 시도 횟수와 시간이 적을수록 좋아요.</p>
    <p>최고 기록(가장 적은 시도, 동점이면 빠른 시간)은 자동으로 저장됩니다.</p>
  </section>

</main>
<aside class="sidead">광고 영역</aside>
</div>

<footer>
  <div style="margin-bottom:8px"><a href="../" style="color:#c7ccd8;text-decoration:none;margin-right:14px">홈</a><a href="../privacy/" style="color:#c7ccd8;text-decoration:none;margin-right:14px">개인정보처리방침</a><a href="../terms/" style="color:#c7ccd8;text-decoration:none;margin-right:14px">이용약관</a><a href="../contact/" style="color:#c7ccd8;text-decoration:none">문의</a></div>
  © 2026 TinyPlay · tinyplay.kr
</footer>

<script>
const EMOJIS=["🐶","🐱","🦊","🐼","🐵","🦁","🐸","🐰"];
const BEST_KEY="tinyplayMemoryBest";

const boardEl=document.getElementById("board");
const movesEl=document.getElementById("moves");
const timeEl=document.getElementById("time");
const bestEl=document.getElementById("best");
const overlayEl=document.getElementById("overlay");
const resultEl=document.getElementById("result");

let cards=[],first=null,second=null,lock=false;
let moves=0,matched=0;
let timerId=null,startAt=0,elapsed=0,running=false;

function fmt(sec){
  const m=String(Math.floor(sec/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  return m+":"+s;
}

function loadBest(){
  try{
    const raw=localStorage.getItem(BEST_KEY);
    if(!raw){bestEl.textContent="-";return null;}
    const b=JSON.parse(raw);
    bestEl.textContent=b.moves+"회 / "+fmt(b.time);
    return b;
  }catch(e){bestEl.textContent="-";return null;}
}

function saveBest(){
  const cur={moves:moves,time:elapsed};
  let best=null;
  try{const raw=localStorage.getItem(BEST_KEY);if(raw)best=JSON.parse(raw);}catch(e){}
  if(!best || moves<best.moves || (moves===best.moves && elapsed<best.time)){
    localStorage.setItem(BEST_KEY,JSON.stringify(cur));
    loadBest();
    return true;
  }
  return false;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function tick(){
  elapsed=Math.floor((performance.now()-startAt)/1000);
  timeEl.textContent=fmt(elapsed);
}
function startTimer(){
  if(running)return;
  running=true;
  startAt=performance.now()-elapsed*1000;
  timerId=setInterval(tick,250);
}
function stopTimer(){
  running=false;
  if(timerId){clearInterval(timerId);timerId=null;}
}

function newGame(){
  stopTimer();
  overlayEl.classList.remove("show");
  first=second=null;lock=false;
  moves=0;matched=0;elapsed=0;
  movesEl.textContent="0";
  timeEl.textContent="00:00";

  const deck=shuffle(EMOJIS.concat(EMOJIS).slice());
  boardEl.innerHTML="";
  cards=deck.map((emoji,idx)=>{
    const btn=document.createElement("button");
    btn.className="mcard";
    btn.type="button";
    btn.innerHTML='<div class="inner"><div class="face back">?</div><div class="face front">'+emoji+'</div></div>';
    const card={el:btn,emoji:emoji,idx:idx,state:"down"};
    btn.addEventListener("click",()=>onFlip(card));
    boardEl.appendChild(btn);
    return card;
  });
}

function onFlip(card){
  if(lock)return;
  if(card.state!=="down")return;
  if(second)return;

  startTimer();

  card.state="up";
  card.el.classList.add("flip");

  if(!first){first=card;return;}
  second=card;

  moves++;
  movesEl.textContent=String(moves);

  if(first.emoji===second.emoji){
    first.state=second.state="matched";
    first.el.classList.add("matched");
    second.el.classList.add("matched");
    matched++;
    first=second=null;
    if(matched===EMOJIS.length)win();
  }else{
    lock=true;
    setTimeout(()=>{
      first.el.classList.remove("flip");
      second.el.classList.remove("flip");
      first.state=second.state="down";
      first=second=null;
      lock=false;
    },800);
  }
}

function win(){
  stopTimer();
  const isBest=saveBest();
  resultEl.innerHTML="시도 <b>"+moves+"회</b> · 시간 <b>"+fmt(elapsed)+"</b>"+
    (isBest?"<br>🏆 신기록 달성!":"");
  setTimeout(()=>overlayEl.classList.add("show"),450);
}

loadBest();
newGame();
</script>
</body>
</html>
