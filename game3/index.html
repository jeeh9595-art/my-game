<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9606850757969636" crossorigin="anonymous"></script>
<title>TinyPlay - 10초에 딱 맞춰서 STOP!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@font-face{
 font-family:'DungGeunMo';
 src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.woff') format('woff');
 font-display:swap;
}
*{box-sizing:border-box}
body{margin:0;background:#0e0c1a;color:#eaeaff;font-family:Arial,'Noto Sans KR',sans-serif}

/* ===== 공통 헤더 (메인화면과 동일) ===== */
.topbar{position:sticky;top:0;z-index:60;background:rgba(7,7,15,.95);border-bottom:2px solid #28e6ff;
 box-shadow:0 0 14px rgba(40,230,255,.35);font-family:'DungGeunMo','Press Start 2P',monospace}
.topbar .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.topbar .nav{display:flex;align-items:center;gap:20px;padding:14px 0}
.topbar a{text-decoration:none}
.topbar .logo{display:inline-block;font-family:'Press Start 2P',monospace;font-size:17px;color:#28e6ff;
 text-shadow:0 0 5px #28e6ff,0 0 14px rgba(40,230,255,.7)}
.topbar .logo .p2{color:#ff2fb0;text-shadow:0 0 5px #ff2fb0,0 0 14px rgba(255,47,176,.7)}
.topbar .menu{display:flex;gap:8px;margin-left:8px}
.topbar .menu a{font-size:13px;padding:7px 12px;border:2px solid #2a2a4d;color:#8f8fc0}
.topbar .menu a:hover{border-color:#ffe23d;color:#ffe23d;text-shadow:0 0 8px rgba(255,226,61,.7)}
.topbar .coin{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:10px;color:#ffe23d;
 display:flex;align-items:center;gap:8px}
.topbar .coin .inf{text-shadow:0 0 8px rgba(255,226,61,.7)}
.topbar .search{display:flex;align-items:center;gap:8px;background:#0a0a18;border:2px solid #ff2fb0;
 padding:8px 12px;color:#ff2fb0}
.topbar .search input{border:0;background:transparent;color:#fff;outline:none;width:150px;
 font-family:'DungGeunMo',monospace;font-size:15px}
.topbar .search input::placeholder{color:#6a6a9a}
@media(max-width:720px){.topbar .menu{display:none}.topbar .coin{display:none}.topbar .search input{width:110px}}

/* ===== 광고 레이아웃 (좌/우 세로) ===== */
.pagewrap{display:flex;justify-content:center;align-items:flex-start;gap:20px;max-width:1400px;margin:0 auto;padding:28px 18px}
.sidead{flex:none;width:160px;min-height:600px;border:1px solid #2a2a4d;background:#15132a;
 display:flex;align-items:center;justify-content:center;color:#6a6a9a;font-size:12px;
 position:sticky;top:84px;writing-mode:vertical-rl;letter-spacing:4px}
.stage{flex:1;min-width:0;max-width:900px}
.gtitle{text-align:center;margin:0 0 16px}
.gtitle h1{font-size:22px;font-weight:800;margin:0 0 6px}
.gtitle p{margin:0;color:#9aa0c0;font-size:13px}
@media(max-width:1100px){.sidead{display:none}.pagewrap{padding:18px 12px}}

/* ===== 게임 (3:2 박스, 내부는 컨테이너 기준 cqw로 스케일) ===== */
#game{position:relative;width:100%;max-width:880px;aspect-ratio:3/2;margin:0 auto;overflow:hidden;
 background:#111;border:1px solid #2a2a4d;border-radius:12px;container-type:inline-size}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none}

.char{position:absolute;pointer-events:none;transform-origin:50% 90%}
#left{left:6.51%;top:9.28%;width:16.28%;height:34.18%}
#right{left:77.47%;top:20.02%;width:19.53%;height:23.44%;transform-origin:50% 100%}
.char img{width:100%;height:100%;display:block}

.dancing#left{animation:leftDance 1.05s ease-in-out infinite}
.dancing#right{animation:rightDance 1.18s ease-in-out infinite}
.still{animation:none!important;transform:none!important}

@keyframes leftDance{
0%,100%{transform:translate(0,0) rotate(-2deg) scale(1)}
25%{transform:translate(-3px,-5px) rotate(3deg) scale(1.015,.985)}
50%{transform:translate(2px,-1px) rotate(-3deg) scale(.985,1.02)}
75%{transform:translate(4px,-5px) rotate(2deg) scale(1.015,.985)}
}
@keyframes rightDance{
0%,100%{transform:translate(0,0) rotate(2deg) scale(1)}
25%{transform:translate(3px,-4px) rotate(-3deg) scale(1.02,.98)}
50%{transform:translate(-2px,-1px) rotate(3deg) scale(.98,1.02)}
75%{transform:translate(-4px,-4px) rotate(-2deg) scale(1.02,.98)}
}

#buttonText{
position:absolute;z-index:10;
left:50%;top:82.4%;
transform:translate(-50%,-50%);
font-weight:900;
font-size:clamp(16px,4.4cqw,66px);
line-height:1;
letter-spacing:-2px;
color:#fff;
text-shadow:0 3px 0 #c85a14,2px 0 0 #c85a14,-2px 0 0 #c85a14;
pointer-events:none;
white-space:nowrap;
}
#hit{
position:absolute;z-index:11;
left:50%;top:82.4%;
transform:translate(-50%,-50%);
width:18%;height:18%;
border:0;background:transparent;border-radius:50%;
cursor:pointer;outline:none;
}
#hit:active{transform:translate(-50%,-50%) scale(.94)}

#bestRecord{
position:absolute;z-index:10;
left:82.7%;top:80.2%;
width:9.0%;height:4.0%;
display:flex;align-items:center;justify-content:center;
font-weight:900;
font-size:clamp(9px,1.35cqw,20px);
letter-spacing:-1px;
color:#ffbf00;
text-shadow:0 1px 0 rgba(255,255,255,.45);
pointer-events:none;
white-space:nowrap;
}

#status{
position:absolute;z-index:12;
left:50%;bottom:1.2%;
transform:translateX(-50%);
color:#fff;font-weight:800;
font-size:clamp(12px,1.6cqw,22px);
text-shadow:0 2px 4px #000;
white-space:nowrap;pointer-events:none;
}
#result{
position:absolute;z-index:12;
left:50%;top:68%;
transform:translate(-50%,-50%) scale(.75);
display:none;padding:12px 22px;border-radius:14px;
background:rgba(0,0,0,.78);color:#fff;
font-size:clamp(18px,3.5cqw,48px);font-weight:900;
white-space:nowrap;
}
#result.show{display:block;animation:pop .28s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}

#flash{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;background:#fff}
#flash.go{animation:flash .22s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
#game.shake{animation:shake .2s ease-out}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}
</style>
</head>
<body>

<header class="topbar">
 <div class="wrap nav">
  <a class="logo" href="../">TINY<span class="p2">PLAY</span></a>
  <div class="menu"><a href="../">홈</a><a href="../#games">게임</a><a href="../#about">소개</a></div>
  <div class="coin">🪙 CREDIT&nbsp;<span class="inf">∞</span></div>
  <div class="search">🔎<input id="q" placeholder="게임 검색..." onkeydown="if(event.key==='Enter')location.href='../#games'"></div>
 </div>
</header>

<div class="pagewrap">
<aside class="sidead">광고 영역</aside>
<main class="stage">
  <div class="gtitle">
    <h1>10초에 딱 맞춰서 STOP!</h1>
    <p>START를 누르고, 정확히 10초에 다시 눌러 멈추세요.</p>
  </div>

  <div id="game">
    <img id="bg" src="bg.png" alt="10초 STOP 게임 배경">
    <div id="left" class="char dancing"><img src="char_left.png" alt=""></div>
    <div id="right" class="char dancing"><img src="char_right.png" alt=""></div>

    <!-- 버튼 그림은 이미지에 그대로 있고, 여기서는 글자만 바꾼다 -->
    <div id="buttonText">START</div>
    <button id="hit" aria-label="START"></button>

    <!-- 최고 기록 숫자도 이미지 위에 텍스트로 직접 표시 -->
    <div id="bestRecord">---.---초</div>

    <div id="result"></div>
    <div id="status">START를 눌러 시작하세요</div>
    <div id="flash"></div>
  </div>
</main>
<aside class="sidead">광고 영역</aside>
</div>

<script>
const game=document.getElementById('game');
const left=document.getElementById('left');
const right=document.getElementById('right');
const hit=document.getElementById('hit');
const buttonText=document.getElementById('buttonText');
const bestRecord=document.getElementById('bestRecord');
const result=document.getElementById('result');
const status=document.getElementById('status');
const flash=document.getElementById('flash');

let running=false;
let startTime=0;
let audioCtx=null;

let bestDiff=Number(localStorage.getItem('tinyplayBestDiff') || 'Infinity');
let bestTime=Number(localStorage.getItem('tinyplayBestTime') || 'NaN');

function renderBest(){
  bestRecord.textContent=Number.isFinite(bestTime)
    ? bestTime.toFixed(3)+'초'
    : '---.---초';
}
renderBest();

function beep(type){
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  const n=audioCtx.currentTime;
  if(type==='start'){
    o.frequency.setValueAtTime(330,n);
    o.frequency.exponentialRampToValueAtTime(620,n+.12);
  }else if(type==='stop'){
    o.frequency.setValueAtTime(520,n);
    o.frequency.exponentialRampToValueAtTime(240,n+.12);
  }else{
    o.frequency.setValueAtTime(520,n);
    o.frequency.setValueAtTime(660,n+.08);
    o.frequency.setValueAtTime(790,n+.16);
  }
  g.gain.setValueAtTime(.0001,n);
  g.gain.exponentialRampToValueAtTime(.13,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+.22);
  o.start(n);o.stop(n+.23);
}

function setDance(on){
  left.classList.toggle('dancing',on);
  right.classList.toggle('dancing',on);
  left.classList.toggle('still',!on);
  right.classList.toggle('still',!on);
}

function startGame(){
  running=true;
  startTime=performance.now();
  setDance(false);

  buttonText.textContent='STOP';
  hit.setAttribute('aria-label','STOP');
  result.classList.remove('show');
  status.textContent='10.00초에 맞춰 STOP!';
  beep('start');
}

function stopGame(){
  running=false;
  const elapsed=(performance.now()-startTime)/1000;
  const diff=Math.abs(elapsed-10);

  if(diff<bestDiff || (Math.abs(diff-bestDiff)<0.0005 && elapsed<bestTime)){
    bestDiff=diff;
    bestTime=elapsed;
    localStorage.setItem('tinyplayBestDiff',String(bestDiff));
    localStorage.setItem('tinyplayBestTime',String(bestTime));
    renderBest();
  }

  setDance(true);
  buttonText.textContent='START';
  hit.setAttribute('aria-label','START');

  result.textContent=diff<=.05
    ? `${elapsed.toFixed(3)}초  🎯 PERFECT!`
    : `${elapsed.toFixed(3)}초  |  오차 ${diff.toFixed(3)}초`;

  result.classList.remove('show');
  void result.offsetWidth;
  result.classList.add('show');

  status.textContent='다시 START를 눌러 도전하세요';
  flash.classList.remove('go');
  void flash.offsetWidth;
  flash.classList.add('go');

  game.classList.remove('shake');
  void game.offsetWidth;
  game.classList.add('shake');

  beep(diff<=.05?'perfect':'stop');
}

hit.addEventListener('click',()=>running?stopGame():startGame());

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    hit.click();
  }
});
</script>
</body>
</html>
