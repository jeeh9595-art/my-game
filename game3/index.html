<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TinyPlay - 10초에 딱 맞춰서 STOP!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@font-face{
 font-family:'DungGeunMo';
 src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/DungGeunMo.woff') format('woff');
 font-display:swap;
}
*{box-sizing:border-box}
body{margin:0;background:#0e0c1a;color:#eaeaff;font-family:Arial,'Noto Sans KR',sans-serif}

/* ===== 공통 헤더 (메인화면과 동일) ===== */
.topbar{position:sticky;top:0;z-index:60;background:rgba(7,7,15,.95);border-bottom:2px solid #28e6ff;
 box-shadow:0 0 14px rgba(40,230,255,.35);font-family:'DungGeunMo','Press Start 2P',monospace}
.topbar .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.topbar .nav{display:flex;align-items:center;gap:20px;padding:14px 0}
.topbar a{text-decoration:none}
.topbar .logo{display:inline-block;font-family:'Press Start 2P',monospace;font-size:17px;color:#28e6ff;
 text-shadow:0 0 5px #28e6ff,0 0 14px rgba(40,230,255,.7)}
.topbar .logo .p2{color:#ff2fb0;text-shadow:0 0 5px #ff2fb0,0 0 14px rgba(255,47,176,.7)}
.topbar .menu{display:flex;gap:8px;margin-left:8px}
.topbar .menu a{font-size:13px;padding:7px 12px;border:2px solid #2a2a4d;color:#8f8fc0}
.topbar .menu a:hover{border-color:#ffe23d;color:#ffe23d;text-shadow:0 0 8px rgba(255,226,61,.7)}
.topbar .coin{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:10px;color:#ffe23d;
 display:flex;align-items:center;gap:8px}
.topbar .coin .inf{text-shadow:0 0 8px rgba(255,226,61,.7)}
.topbar .search{display:flex;align-items:center;gap:8px;background:#0a0a18;border:2px solid #ff2fb0;
 padding:8px 12px;color:#ff2fb0}
.topbar .search input{border:0;background:transparent;color:#fff;outline:none;width:150px;
 font-family:'DungGeunMo',monospace;font-size:15px}
.topbar .search input::placeholder{color:#6a6a9a}
@media(max-width:720px){.topbar .menu{display:none}.topbar .coin{display:none}.topbar .search input{width:110px}}

/* ===== 광고 레이아웃 (좌/우 세로) ===== */
.pagewrap{display:flex;justify-content:center;align-items:flex-start;gap:20px;max-width:1400px;margin:0 auto;padding:28px 18px}
.sidead{flex:none;width:160px;min-height:600px;border:1px solid #2a2a4d;background:#15132a;
 display:flex;align-items:center;justify-content:center;color:#6a6a9a;font-size:12px;
 position:sticky;top:84px;writing-mode:vertical-rl;letter-spacing:4px}
.stage{flex:1;min-width:0;max-width:900px}
.gtitle{text-align:center;margin:0 0 16px}
.gtitle h1{font-size:22px;font-weight:800;margin:0 0 6px}
.gtitle p{margin:0;color:#9aa0c0;font-size:13px}
@media(max-width:1100px){.sidead{display:none}.pagewrap{padding:18px 12px}}

/* ===== 게임 ===== */
#game{position:relative;width:100%;max-width:880px;margin:0 auto;background:#111;
 border:1px solid #2a2a4d;border-radius:12px;line-height:0;overflow:hidden}
#art{width:100%;height:auto;display:block;user-select:none}
#game::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(circle at 50% 75%,rgba(255,255,255,.08),transparent 30%);opacity:0;transition:.2s}
#hit{position:absolute;left:50%;top:83.2%;transform:translate(-50%,-50%);
 width:18%;aspect-ratio:1;height:auto;
 border-radius:50%;cursor:pointer;background:transparent;border:0;outline:none;transition:transform .08s ease}
#hit:hover{transform:translate(-50%,-50%) scale(1.04)}
#hit:active{transform:translate(-50%,-50%) scale(.91)}
#status{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);
 font:700 clamp(14px,1.6vw,22px)/1.2 Arial,'Noto Sans KR',sans-serif;color:#fff;
 text-shadow:0 2px 5px #000;pointer-events:none;white-space:nowrap}
#result{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%) scale(.7);
 padding:14px 24px;border-radius:14px;background:rgba(0,0,0,.78);
 color:#fff;font:800 clamp(20px,3vw,40px) Arial,'Noto Sans KR',sans-serif;
 display:none;pointer-events:none;white-space:nowrap}
#result.show{display:block;animation:pop .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .22s ease-out}
@keyframes flash{0%{opacity:.42}100%{opacity:0}}
#game.success{animation:shake .22s ease-out}
#game.fail{animation:shake .16s ease-out}
@keyframes shake{
  0%{transform:translateX(0)}25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}
}
</style>
</head>
<body>

<header class="topbar">
 <div class="wrap nav">
  <a class="logo" href="../">TINY<span class="p2">PLAY</span></a>
  <div class="menu"><a href="../">홈</a><a href="../#games">게임</a><a href="../#about">소개</a></div>
  <div class="coin">🪙 CREDIT&nbsp;<span class="inf">∞</span></div>
  <div class="search">🔎<input id="q" placeholder="게임 검색..." onkeydown="if(event.key==='Enter')location.href='../#games'"></div>
 </div>
</header>

<div class="pagewrap">
<aside class="sidead">광고 영역</aside>
<main class="stage">
  <div class="gtitle">
    <h1>10초에 딱 맞춰서 STOP!</h1>
    <p>START를 누르고, 정확히 10초에 다시 눌러 멈추세요.</p>
  </div>
  <div id="game">
    <img id="art" src="art.png" alt="10초 STOP 게임">
    <button id="hit" aria-label="START 또는 STOP"></button>
    <div id="result"></div>
    <div id="status">START를 눌러 시작하세요</div>
    <div id="flash"></div>
  </div>
</main>
<aside class="sidead">광고 영역</aside>
</div>

<script>
const hit=document.getElementById('hit');
const status=document.getElementById('status');
const result=document.getElementById('result');
const game=document.getElementById('game');
const flash=document.getElementById('flash');

let state='ready', startTime=0, audioCtx=null;

function sound(type){
  // 외부 음원 파일 없이 브라우저에서 직접 짧은 효과음을 생성
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  const now=audioCtx.currentTime;
  if(type==='start'){
    o.type='sine'; o.frequency.setValueAtTime(260,now);
    o.frequency.exponentialRampToValueAtTime(520,now+.12);
    g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.16,now+.015);
    g.gain.exponentialRampToValueAtTime(.0001,now+.16); o.start(now); o.stop(now+.17);
  } else if(type==='click'){
    o.type='square'; o.frequency.setValueAtTime(180,now);
    g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.10,now+.008);
    g.gain.exponentialRampToValueAtTime(.0001,now+.06); o.start(now); o.stop(now+.07);
  } else if(type==='perfect'){
    o.type='sine'; o.frequency.setValueAtTime(523,now);
    o.frequency.setValueAtTime(659,now+.08); o.frequency.setValueAtTime(784,now+.16);
    g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.18,now+.015);
    g.gain.exponentialRampToValueAtTime(.0001,now+.28); o.start(now); o.stop(now+.29);
  } else {
    o.type='sawtooth'; o.frequency.setValueAtTime(180,now);
    o.frequency.exponentialRampToValueAtTime(90,now+.18);
    g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.12,now+.015);
    g.gain.exponentialRampToValueAtTime(.0001,now+.2); o.start(now); o.stop(now+.21);
  }
}

function pulse(cls){
  game.classList.remove(cls);
  void game.offsetWidth;
  game.classList.add(cls);
}

function flashNow(){
  flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
}

function startGame(){
  sound('start');
  state='running';
  startTime=performance.now();
  result.classList.remove('show');
  status.textContent='10.00초에 맞춰 다시 클릭!';
}

function stopGame(){
  const elapsed=(performance.now()-startTime)/1000;
  const diff=elapsed-10;
  const abs=Math.abs(diff);
  state='result';
  sound(abs<=.05?'perfect':'fail');
  flashNow();
  pulse(abs<=.05?'success':'fail');
  result.textContent=abs<=.05
    ? `${elapsed.toFixed(3)}초  🎯 PERFECT!`
    : `${elapsed.toFixed(3)}초  |  오차 ${abs.toFixed(3)}초`;
  result.classList.remove('show'); void result.offsetWidth; result.classList.add('show');
  status.textContent=abs<=.05
    ? '완벽합니다! 다시 START를 눌러 도전하세요'
    : '다시 하려면 START를 클릭하세요';
}

hit.addEventListener('click',()=>{
  sound('click');
  if(state==='ready'||state==='result') startGame();
  else stopGame();
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();hit.click();}
});
</script>
</body>
</html>
